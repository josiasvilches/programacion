<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Panel de Administración | Rotisería Cacho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .smooth-transition {
            transition: all 0.3s ease;
        }
        
        .input-focus:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        
        .hover-lift:hover {
            transform: translateY(-2px);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        .admin-card {
            transition: all 0.3s ease;
            border-left: 4px solid #ef4444;
        }
        
        .admin-card:hover {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        
        .modal-content {
            animation: modalSlideIn 0.3s ease-out;
        }
        
        @keyframes modalSlideIn {
            from { opacity: 0; transform: scale(0.9) translateY(-20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        .status-active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .status-inactive {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        .status-pending {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        
        .role-admin {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
        }
        
        .role-user {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        }
        
        .action-button {
            transition: all 0.2s ease;
        }
        
        .action-button:hover {
            transform: scale(1.05);
        }
        
        .stats-card {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        }
        
        .user-avatar {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }
        
        .notification-badge {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-6 py-8">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="stats-card rounded-xl p-6 border border-gray-200">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">Total Usuarios</p>
                        <p class="text-2xl font-bold text-gray-900" id="totalUsers">15</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="stats-card rounded-xl p-6 border border-gray-200">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">Activos</p>
                        <p class="text-2xl font-bold text-green-600" id="activeUsers">10</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="stats-card rounded-xl p-6 border border-gray-200">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">Pendientes</p>
                        <p class="text-2xl font-bold text-yellow-600" id="pendingUsers">3</p>
                    </div>
                    <div class="w-12 h-12 bg-yellow-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="stats-card rounded-xl p-6 border border-gray-200">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">Administradores</p>
                        <p class="text-2xl font-bold text-purple-600" id="adminUsers">2</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center space-y-4 sm:space-y-0">
                <div>
                    <h2 class="text-xl font-bold text-gray-900">Gestión de Usuarios</h2>
                    <p class="text-gray-600">Administra usuarios, roles y permisos del sistema</p>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="exportUsers()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg font-medium hover:bg-gray-200 smooth-transition flex items-center space-x-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <span>Exportar</span>
                    </button>
                    <button onclick="openAddUserModal()" class="gradient-bg text-white px-6 py-3 rounded-lg font-medium hover-lift smooth-transition flex items-center space-x-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                        </svg>
                        <span>Agregar Usuario</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-8">
            <div class="flex flex-wrap gap-3">
                <button onclick="filterUsers('all')" class="filter-btn px-4 py-2 rounded-lg font-medium smooth-transition bg-red-500 text-white" data-filter="all">
                    Todos
                </button>
                <button onclick="filterUsers('active')" class="filter-btn px-4 py-2 rounded-lg font-medium smooth-transition bg-gray-100 text-gray-700 hover:bg-gray-200" data-filter="active">
                    Activos
                </button>
                <button onclick="filterUsers('pending')" class="filter-btn px-4 py-2 rounded-lg font-medium smooth-transition bg-gray-100 text-gray-700 hover:bg-gray-200" data-filter="pending">
                    Pendientes
                </button>
                <button onclick="filterUsers('inactive')" class="filter-btn px-4 py-2 rounded-lg font-medium smooth-transition bg-gray-100 text-gray-700 hover:bg-gray-200" data-filter="inactive">
                    Inactivos
                </button>
                <button onclick="filterUsers('admin')" class="filter-btn px-4 py-2 rounded-lg font-medium smooth-transition bg-gray-100 text-gray-700 hover:bg-gray-200" data-filter="admin">
                    Administradores
                </button>
            </div>
        </div>

        <!-- Users Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="usersGrid">
            <!-- Users will be dynamically loaded here -->
        </div>
    </div>

    <!-- Add/Edit User Modal -->
    <div id="userModal" class="fixed inset-0 z-50 hidden" onclick="closeUserModal()">
        <div class="modal-backdrop fixed inset-0"></div>
        <div class="fixed inset-0 flex items-center justify-center p-4">
            <div class="modal-content bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
                <div class="p-6 border-b border-gray-200">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-bold text-gray-900" id="modalTitle">Agregar Usuario</h3>
                        <button onclick="closeUserModal()" class="text-gray-400 hover:text-gray-600 smooth-transition">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <form id="userForm" class="p-6 space-y-6">
                    <input type="hidden" id="userId" value="">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nombre Completo</label>
                            <input type="text" id="userName" class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus smooth-transition" placeholder="Juan Pérez" required>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                            <input type="email" id="userEmail" class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus smooth-transition" placeholder="juan@email.com" required>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono</label>
                            <input type="tel" id="userPhone" class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus smooth-transition" placeholder="+54 9 11 1234-5678">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Rol</label>
                            <select id="userRole" class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus smooth-transition" required>
                                <option value="user">Usuario</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Estado</label>
                            <select id="userStatus" class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus smooth-transition" required>
                                <option value="pending">Pendiente</option>
                                <option value="active">Activo</option>
                                <option value="inactive">Inactivo</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Registro</label>
                            <input type="date" id="userRegistrationDate" class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus smooth-transition">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Notas del Administrador</label>
                        <textarea id="userNotes" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg input-focus smooth-transition" placeholder="Notas internas sobre el usuario..."></textarea>
                    </div>
                    
                    <div class="flex justify-end space-x-4 pt-6 border-t border-gray-200">
                        <button type="button" onclick="closeUserModal()" class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-50 smooth-transition">
                            Cancelar
                        </button>
                        <button type="submit" class="gradient-bg text-white px-6 py-3 rounded-lg font-medium hover-lift smooth-transition">
                            Guardar Usuario
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Action Confirmation Modal -->
    <div id="actionModal" class="fixed inset-0 z-50 hidden" onclick="closeActionModal()">
        <div class="modal-backdrop fixed inset-0"></div>
        <div class="fixed inset-0 flex items-center justify-center p-4">
            <div class="modal-content bg-white rounded-2xl shadow-2xl max-w-md w-full" onclick="event.stopPropagation()">
                <div class="p-6">
                    <div class="flex items-center space-x-4 mb-4">
                        <div class="w-12 h-12 rounded-full flex items-center justify-center" id="actionIcon">
                            <!-- Icon will be set dynamically -->
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-gray-900" id="actionTitle">Confirmar Acción</h3>
                            <p class="text-gray-600" id="actionSubtitle">Esta acción afectará al usuario</p>
                        </div>
                    </div>
                    
                    <p class="text-gray-700 mb-6" id="actionMessage">¿Estás seguro de que quieres realizar esta acción?</p>
                    
                    <div class="flex justify-end space-x-4">
                        <button onclick="closeActionModal()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-50 smooth-transition">
                            Cancelar
                        </button>
                        <button onclick="confirmAction()" class="px-4 py-2 rounded-lg font-medium smooth-transition" id="confirmButton">
                            Confirmar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample users data
        let users = [
            {
                id: 1,
                name: "Juan Pérez",
                email: "juan@email.com",
                phone: "+54 9 11 1234-5678",
                role: "admin",
                status: "active",
                registrationDate: "2024-01-15",
                lastLogin: "2024-01-20",
                notes: "Administrador principal"
            },
            {
                id: 2,
                name: "María González",
                email: "maria@email.com",
                phone: "+54 9 11 2345-6789",
                role: "user",
                status: "active",
                registrationDate: "2024-01-18",
                lastLogin: "2024-01-19",
                notes: "Cliente frecuente"
            },
            {
                id: 3,
                name: "Carlos Rodríguez",
                email: "carlos@email.com",
                phone: "+54 9 11 3456-7890",
                role: "user",
                status: "pending",
                registrationDate: "2024-01-20",
                lastLogin: null,
                notes: "Pendiente de validación"
            },
            {
                id: 4,
                name: "Ana Martínez",
                email: "ana@email.com",
                phone: "+54 9 11 4567-8901",
                role: "user",
                status: "active",
                registrationDate: "2024-01-16",
                lastLogin: "2024-01-18",
                notes: ""
            },
            {
                id: 5,
                name: "Luis Torres",
                email: "luis@email.com",
                phone: "+54 9 11 5678-9012",
                role: "user",
                status: "pending",
                registrationDate: "2024-01-21",
                lastLogin: null,
                notes: "Registro reciente"
            },
            {
                id: 6,
                name: "Sofia López",
                email: "sofia@email.com",
                phone: "+54 9 11 6789-0123",
                role: "admin",
                status: "active",
                registrationDate: "2024-01-10",
                lastLogin: "2024-01-20",
                notes: "Administrador de contenido"
            },
            {
                id: 7,
                name: "Diego Fernández",
                email: "diego@email.com",
                phone: "+54 9 11 7890-1234",
                role: "user",
                status: "inactive",
                registrationDate: "2024-01-12",
                lastLogin: "2024-01-14",
                notes: "Usuario inactivo por solicitud propia"
            },
            {
                id: 8,
                name: "Laura Sánchez",
                email: "laura@email.com",
                phone: "+54 9 11 8901-2345",
                role: "user",
                status: "pending",
                registrationDate: "2024-01-22",
                lastLogin: null,
                notes: "Esperando validación de documentos"
            }
        ];

        let currentFilter = 'all';
        let editingUserId = null;
        let actionUserId = null;
        let actionType = null;

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            renderUsers();
            updateStats();
        });

        // Render users grid
        function renderUsers() {
            const grid = document.getElementById('usersGrid');
            const filteredUsers = filterUsersByStatus(users, currentFilter);
            
            grid.innerHTML = filteredUsers.map(user => `
                <div class="admin-card bg-white rounded-xl shadow-sm p-6 fade-in">
                    <div class="flex items-start space-x-4 mb-4">
                        <div class="user-avatar w-12 h-12 rounded-full flex items-center justify-center text-white font-bold text-lg">
                            ${user.name.split(' ').map(n => n[0]).join('').substring(0, 2)}
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center space-x-2 mb-1">
                                <h3 class="text-lg font-bold text-gray-900">${user.name}</h3>
                                <span class="role-${user.role} text-white text-xs px-2 py-1 rounded-full font-medium">
                                    ${user.role === 'admin' ? 'Admin' : 'Usuario'}
                                </span>
                            </div>
                            <p class="text-gray-600 text-sm">${user.email}</p>
                            <p class="text-gray-500 text-xs">${user.phone}</p>
                        </div>
                    </div>
                    
                    <div class="space-y-3 mb-4">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-medium text-gray-600">Estado:</span>
                            <span class="status-${user.status} text-white text-xs px-3 py-1 rounded-full font-medium">
                                ${getStatusName(user.status)}
                            </span>
                        </div>
                        
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-medium text-gray-600">Registro:</span>
                            <span class="text-sm text-gray-700">${formatDate(user.registrationDate)}</span>
                        </div>
                        
                        ${user.lastLogin ? `
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-medium text-gray-600">Último acceso:</span>
                            <span class="text-sm text-gray-700">${formatDate(user.lastLogin)}</span>
                        </div>
                        ` : ''}
                    </div>
                    
                    <div class="flex flex-wrap gap-2">
                        ${user.status === 'pending' ? `
                        <button onclick="validateUser(${user.id})" class="action-button bg-green-500 text-white px-3 py-1 rounded-lg text-sm font-medium hover-lift smooth-transition" title="Validar Usuario">
                            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Validar
                        </button>
                        ` : ''}
                        
                        ${user.role === 'user' ? `
                        <button onclick="promoteToAdmin(${user.id})" class="action-button bg-purple-500 text-white px-3 py-1 rounded-lg text-sm font-medium hover-lift smooth-transition" title="Hacer Administrador">
                            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                            Promover
                        </button>
                        ` : user.role === 'admin' ? `
                        <span class="action-button bg-purple-100 text-purple-700 px-3 py-1 rounded-lg text-sm font-medium flex items-center" title="Usuario Administrador">
                            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                            </svg>
                            Administrador
                        </span>
                        ` : ''}
                        
                        <button onclick="editUser(${user.id})" class="action-button bg-yellow-500 text-white px-3 py-1 rounded-lg text-sm font-medium hover-lift smooth-transition" title="Editar">
                            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                            </svg>
                            Editar
                        </button>
                        
                        ${user.status === 'active' ? `
                        <button onclick="deactivateUser(${user.id})" class="action-button bg-red-500 text-white px-3 py-1 rounded-lg text-sm font-medium hover-lift smooth-transition" title="Dar de Baja">
                            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728L5.636 5.636m12.728 12.728L18.364 5.636M5.636 18.364l12.728-12.728"></path>
                            </svg>
                            Dar de Baja
                        </button>
                        ` : user.status === 'inactive' ? `
                        <button onclick="activateUser(${user.id})" class="action-button bg-green-500 text-white px-3 py-1 rounded-lg text-sm font-medium hover-lift smooth-transition" title="Reactivar">
                            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Reactivar
                        </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Filter functions
        function filterUsers(filter) {
            currentFilter = filter;
            
            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.className = 'filter-btn px-4 py-2 rounded-lg font-medium smooth-transition bg-red-500 text-white';
                } else {
                    btn.className = 'filter-btn px-4 py-2 rounded-lg font-medium smooth-transition bg-gray-100 text-gray-700 hover:bg-gray-200';
                }
            });
            
            renderUsers();
        }

        function filterUsersByStatus(users, filter) {
            if (filter === 'all') return users;
            if (filter === 'admin') return users.filter(u => u.role === 'admin');
            return users.filter(u => u.status === filter);
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('activeUsers').textContent = users.filter(u => u.status === 'active').length;
            document.getElementById('pendingUsers').textContent = users.filter(u => u.status === 'pending').length;
            document.getElementById('adminUsers').textContent = users.filter(u => u.role === 'admin').length;
            
            const pendingCount = users.filter(u => u.status === 'pending').length;
            document.getElementById('pendingCount').textContent = `${pendingCount} Pendientes`;
        }

        // User actions
        function validateUser(id) {
            showActionModal(
                'validate',
                id,
                'Validar Usuario',
                'Aprobar registro',
                '¿Confirmas que quieres validar este usuario? Podrá acceder al sistema.',
                'bg-green-100',
                '<svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
                'bg-green-500 text-white hover:bg-green-600'
            );
        }

        function promoteToAdmin(id) {
            showActionModal(
                'promote',
                id,
                'Promover a Administrador',
                'Cambiar rol de usuario',
                '¿Estás seguro de que quieres hacer administrador a este usuario? Tendrá acceso completo al sistema.',
                'bg-purple-100',
                '<svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>',
                'bg-purple-500 text-white hover:bg-purple-600'
            );
        }

        function deactivateUser(id) {
            showActionModal(
                'deactivate',
                id,
                'Dar de Baja Usuario',
                'Desactivar cuenta',
                '¿Estás seguro de que quieres dar de baja a este usuario? No podrá acceder al sistema.',
                'bg-red-100',
                '<svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728L5.636 5.636m12.728 12.728L18.364 5.636M5.636 18.364l12.728-12.728"></path></svg>',
                'bg-red-500 text-white hover:bg-red-600'
            );
        }

        function activateUser(id) {
            showActionModal(
                'activate',
                id,
                'Reactivar Usuario',
                'Activar cuenta',
                '¿Confirmas que quieres reactivar este usuario? Podrá volver a acceder al sistema.',
                'bg-green-100',
                '<svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
                'bg-green-500 text-white hover:bg-green-600'
            );
        }

        // Modal functions
        function showActionModal(action, userId, title, subtitle, message, iconBg, iconSvg, buttonClass) {
            actionType = action;
            actionUserId = userId;
            
            document.getElementById('actionTitle').textContent = title;
            document.getElementById('actionSubtitle').textContent = subtitle;
            document.getElementById('actionMessage').textContent = message;
            document.getElementById('actionIcon').className = `w-12 h-12 rounded-full flex items-center justify-center ${iconBg}`;
            document.getElementById('actionIcon').innerHTML = iconSvg;
            document.getElementById('confirmButton').className = `px-4 py-2 rounded-lg font-medium smooth-transition ${buttonClass}`;
            
            document.getElementById('actionModal').classList.remove('hidden');
        }

        function closeActionModal() {
            document.getElementById('actionModal').classList.add('hidden');
            actionType = null;
            actionUserId = null;
        }

        function confirmAction() {
            if (!actionType || !actionUserId) return;
            
            const userIndex = users.findIndex(u => u.id === actionUserId);
            if (userIndex === -1) return;
            
            switch (actionType) {
                case 'validate':
                    users[userIndex].status = 'active';
                    break;
                case 'promote':
                    users[userIndex].role = 'admin';
                    break;
                case 'deactivate':
                    users[userIndex].status = 'inactive';
                    break;
                case 'activate':
                    users[userIndex].status = 'active';
                    break;
            }
            
            renderUsers();
            updateStats();
            closeActionModal();
        }

        function openAddUserModal() {
            editingUserId = null;
            document.getElementById('modalTitle').textContent = 'Agregar Usuario';
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('userRegistrationDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('userModal').classList.remove('hidden');
        }

        function closeUserModal() {
            document.getElementById('userModal').classList.add('hidden');
        }

        function editUser(id) {
            const user = users.find(u => u.id === id);
            if (!user) return;
            
            editingUserId = id;
            document.getElementById('modalTitle').textContent = 'Editar Usuario';
            document.getElementById('userId').value = user.id;
            document.getElementById('userName').value = user.name;
            document.getElementById('userEmail').value = user.email;
            document.getElementById('userPhone').value = user.phone;
            document.getElementById('userRole').value = user.role;
            document.getElementById('userStatus').value = user.status;
            document.getElementById('userRegistrationDate').value = user.registrationDate;
            document.getElementById('userNotes').value = user.notes;
            
            document.getElementById('userModal').classList.remove('hidden');
        }

        // Form submission
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('userName').value,
                email: document.getElementById('userEmail').value,
                phone: document.getElementById('userPhone').value,
                role: document.getElementById('userRole').value,
                status: document.getElementById('userStatus').value,
                registrationDate: document.getElementById('userRegistrationDate').value,
                notes: document.getElementById('userNotes').value,
                lastLogin: null
            };
            
            if (editingUserId) {
                // Edit existing user
                const index = users.findIndex(u => u.id === editingUserId);
                if (index !== -1) {
                    users[index] = { ...users[index], ...formData };
                }
            } else {
                // Add new user
                const newId = Math.max(...users.map(u => u.id)) + 1;
                users.push({ id: newId, ...formData });
            }
            
            renderUsers();
            updateStats();
            closeUserModal();
        });

        // Utility functions
        function getStatusName(status) {
            const names = {
                'active': 'Activo',
                'inactive': 'Inactivo',
                'pending': 'Pendiente'
            };
            return names[status] || status;
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('es-AR');
        }

        function exportUsers() {
            // Simulate export functionality
            alert('Exportando lista de usuarios...\n\nEn una implementación real, esto generaría un archivo CSV o Excel con todos los datos de usuarios.');
        }

        function goBack() {
            // Simulate navigation back to main admin panel
            alert('Navegando de vuelta al panel principal...');
        }
    </script>
