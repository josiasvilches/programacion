<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Pedidos - Rotisería Cacho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }

      .smooth-transition {
        transition: all 0.3s ease;
      }

      .input-focus:focus {
        border-color: #ef4444;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
      }

      .hover-lift:hover {
        transform: translateY(-2px);
      }

      .gradient-bg {
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      }

      .order-card {
        transition: all 0.3s ease;
      }

      .order-card:hover {
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }

      .filter-active {
        background-color: #ef4444;
        color: white;
      }

      .fade-in {
        animation: fadeIn 0.5s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .pulse-animation {
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      .status-pending {
        background-color: #fbbf24;
      }
      .status-preparing {
        background-color: #3b82f6;
      }
      .status-ready {
        background-color: #10b981;
      }
      .status-delivered {
        background-color: #6b7280;
      }
      .status-cancelled {
        background-color: #ef4444;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
  
    <!-- Hero Section -->
    <div class="gradient-bg text-white py-12">
      <div class="max-w-4xl mx-auto px-6 text-center">
        <h2 class="text-4xl font-bold mb-4">Historial de Pedidos</h2>
        <p class="text-xl text-red-100 mb-8">
          Seguí el estado de tus pedidos y repetí tus favoritos
        </p>
        <div class="flex justify-center">
          <div
            class="bg-white bg-opacity-20 backdrop-blur-sm rounded-lg p-4 flex items-center space-x-6"
          >
            <div class="text-center">
              <div id="total-orders" class="text-2xl font-bold">0</div>
              <div class="text-sm text-red-100">Pedidos totales</div>
            </div>
            <div class="h-8 w-px bg-white bg-opacity-30"></div>
            <div class="text-center">
              <div id="total-spent" class="text-2xl font-bold">$0</div>
              <div class="text-sm text-red-100">Total gastado</div>
            </div>
            <div class="h-8 w-px bg-white bg-opacity-30"></div>
            <div class="text-center">
              <div id="pending-orders" class="text-2xl font-bold">0</div>
              <div class="text-sm text-red-100">Pendientes</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="max-w-4xl mx-auto px-6 py-8">
      <!-- Filters Section -->
      <div class="bg-white rounded-2xl shadow-sm p-6 mb-8">
        <div class="flex flex-col space-y-4">
          <!-- Search Bar -->
          <div class="flex-1">
            <div class="relative">
              <input
                type="text"
                id="search-input"
                placeholder="Buscar por número de pedido o productos..."
                class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg input-focus smooth-transition"
              />
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center">
                <svg
                  class="w-5 h-5 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                  ></path>
                </svg>
              </div>
            </div>
          </div>

          <!-- Status Filters -->
          <div class="flex flex-wrap gap-2">
            <button
              onclick="filterByStatus('all')"
              id="filter-all"
              class="filter-btn filter-active px-4 py-2 rounded-lg text-sm font-medium smooth-transition"
            >
              Todos (<span id="count-all">0</span>)
            </button>
            <button
              onclick="filterByStatus('pending')"
              id="filter-pending"
              class="filter-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 py-2 rounded-lg text-sm font-medium smooth-transition"
            >
              Pendientes (<span id="count-pending">0</span>)
            </button>
            <button
              onclick="filterByStatus('preparing')"
              id="filter-preparing"
              class="filter-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 py-2 rounded-lg text-sm font-medium smooth-transition"
            >
              En preparación (<span id="count-preparing">0</span>)
            </button>
            <button
              onclick="filterByStatus('ready')"
              id="filter-ready"
              class="filter-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 py-2 rounded-lg text-sm font-medium smooth-transition"
            >
              Listos (<span id="count-ready">0</span>)
            </button>
            <button
              onclick="filterByStatus('delivered')"
              id="filter-delivered"
              class="filter-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 py-2 rounded-lg text-sm font-medium smooth-transition"
            >
              Entregados (<span id="count-delivered">0</span>)
            </button>
            <button
              onclick="filterByStatus('cancelled')"
              id="filter-cancelled"
              class="filter-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 py-2 rounded-lg text-sm font-medium smooth-transition"
            >
              Cancelados (<span id="count-cancelled">0</span>)
            </button>
          </div>

          <!-- Date and Amount Filters -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Período</label
              >
              <select
                id="date-filter"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus smooth-transition"
              >
                <option value="all">Todos los períodos</option>
                <option value="today">Hoy</option>
                <option value="week">Esta semana</option>
                <option value="month">Este mes</option>
                <option value="custom">Rango personalizado</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Monto</label
              >
              <select
                id="amount-filter"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus smooth-transition"
              >
                <option value="all">Todos los montos</option>
                <option value="0-2000">Hasta $2.000</option>
                <option value="2000-5000">$2.000 - $5.000</option>
                <option value="5000-10000">$5.000 - $10.000</option>
                <option value="10000+">Más de $10.000</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Ordenar por</label
              >
              <select
                id="sort-select"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus smooth-transition"
              >
                <option value="date-desc">Más recientes</option>
                <option value="date-asc">Más antiguos</option>
                <option value="amount-desc">Mayor monto</option>
                <option value="amount-asc">Menor monto</option>
                <option value="status">Por estado</option>
              </select>
            </div>
          </div>

          <!-- Custom Date Range (hidden by default) -->
          <div id="custom-date-range" class="hidden grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Desde</label
              >
              <input
                type="date"
                id="date-from"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus smooth-transition"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Hasta</label
              >
              <input
                type="date"
                id="date-to"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus smooth-transition"
              />
            </div>
          </div>

          <!-- Clear Filters -->
          <div
            class="flex justify-between items-center pt-4 border-t border-gray-200"
          >
            <p class="text-gray-600">
              Mostrando
              <span id="results-count" class="font-semibold text-gray-800"
                >0</span
              >
              pedidos
              <span id="filter-description" class="text-gray-500"></span>
            </p>
            <button
              onclick="clearAllFilters()"
              class="text-red-500 hover:text-red-600 font-medium text-sm smooth-transition"
            >
              Limpiar filtros
            </button>
          </div>
        </div>
      </div>

      <!-- Orders List -->
      <div id="orders-container" class="space-y-4">
        <!-- Orders will be dynamically inserted here -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="text-center py-16 hidden">
        <div
          class="w-24 h-24 bg-gray-100 rounded-full mx-auto mb-6 flex items-center justify-center"
        >
          <svg
            class="w-12 h-12 text-gray-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
            ></path>
          </svg>
        </div>
        <h3 class="text-xl font-semibold text-gray-600 mb-2">
          No se encontraron pedidos
        </h3>
        <p class="text-gray-500 mb-6">
          Probá ajustando los filtros o realizá tu primer pedido
        </p>
        <button
          onclick="clearAllFilters()"
          class="bg-red-500 text-white px-6 py-3 rounded-lg hover:bg-red-600 smooth-transition mr-3"
        >
          Limpiar filtros
        </button>
        <button
          onclick="goToProducts()"
          class="bg-gray-200 text-gray-800 px-6 py-3 rounded-lg hover:bg-gray-300 smooth-transition"
        >
          Ver productos
        </button>
      </div>
    </div>

    <!-- Order Details Modal -->
    <div
      id="order-modal"
      class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden"
    >
      <div class="flex items-center justify-center min-h-screen p-4">
        <div
          class="bg-white rounded-2xl p-8 max-w-2xl w-full max-h-screen overflow-y-auto"
        >
          <div class="flex justify-between items-center mb-6">
            <h3 class="text-2xl font-bold text-gray-800">
              Detalles del Pedido
            </h3>
            <button
              onclick="closeOrderModal()"
              class="text-gray-400 hover:text-gray-600 smooth-transition"
            >
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                ></path>
              </svg>
            </button>
          </div>
          <div id="order-modal-content">
            <!-- Order details will be inserted here -->
          </div>
        </div>
      </div>
    </div>

    <script>
      // Sample orders data
      const orders = [
        {
          id: 1001,
          date: new Date("2024-01-15T19:30:00"),
          status: "delivered",
          total: 4500,
          items: [
            { name: "Pollo al Spiedo Entero", quantity: 1, price: 3500 },
            { name: "Papas Fritas Caseras", quantity: 1, price: 1200 },
          ],
          deliveryAddress: "Av. Corrientes 1234, CABA",
          paymentMethod: "Efectivo",
          notes: "Sin cebolla en las papas",
        },
        {
          id: 1002,
          date: new Date("2024-01-14T20:15:00"),
          status: "cancelled",
          total: 2700,
          items: [
            {
              name: "Empanadas de Carne (6 unidades)",
              quantity: 1,
              price: 2700,
            },
          ],
          deliveryAddress: "San Martín 567, CABA",
          paymentMethod: "Tarjeta",
          notes: "Cancelado por el cliente",
        },
        {
          id: 1003,
          date: new Date("2024-01-13T18:45:00"),
          status: "ready",
          total: 6200,
          items: [
            {
              name: "Milanesas de Pollo (4 unidades)",
              quantity: 1,
              price: 2800,
            },
            { name: "Ensalada Mixta", quantity: 1, price: 1500 },
            { name: "Coca Cola 1.5L", quantity: 2, price: 800 },
            { name: "Flan Casero", quantity: 1, price: 1200 },
          ],
          deliveryAddress: "Rivadavia 890, CABA",
          paymentMethod: "Transferencia",
          notes: "",
        },
        {
          id: 1004,
          date: new Date("2024-01-12T21:00:00"),
          status: "preparing",
          total: 8900,
          items: [
            { name: "Pollo al Spiedo Entero", quantity: 2, price: 3500 },
            { name: "Papas Fritas Caseras", quantity: 2, price: 1200 },
            { name: "Ensalada Rusa", quantity: 1, price: 1400 },
          ],
          deliveryAddress: "Florida 456, CABA",
          paymentMethod: "Efectivo",
          notes: "Pedido para las 21:30",
        },
        {
          id: 1005,
          date: new Date("2024-01-11T19:00:00"),
          status: "pending",
          total: 3700,
          items: [
            {
              name: "Empanadas de Pollo (6 unidades)",
              quantity: 1,
              price: 2500,
            },
            { name: "Flan Casero", quantity: 1, price: 1200 },
          ],
          deliveryAddress: "Belgrano 123, CABA",
          paymentMethod: "Tarjeta",
          notes: "",
        },
        {
          id: 1006,
          date: new Date("2024-01-10T20:30:00"),
          status: "delivered",
          total: 12500,
          items: [
            { name: "Pollo al Spiedo Entero", quantity: 3, price: 3500 },
            {
              name: "Empanadas de Carne (6 unidades)",
              quantity: 1,
              price: 2700,
            },
            { name: "Papas Fritas Caseras", quantity: 2, price: 1200 },
            { name: "Coca Cola 1.5L", quantity: 2, price: 800 },
          ],
          deliveryAddress: "Callao 789, CABA",
          paymentMethod: "Efectivo",
          notes: "Pedido familiar",
        },
        {
          id: 1007,
          date: new Date("2024-01-09T18:15:00"),
          status: "delivered",
          total: 5400,
          items: [
            {
              name: "Milanesas de Carne (4 unidades)",
              quantity: 1,
              price: 3200,
            },
            { name: "Puré de Papas", quantity: 1, price: 1000 },
            { name: "Flan Casero", quantity: 1, price: 1200 },
          ],
          deliveryAddress: "Santa Fe 321, CABA",
          paymentMethod: "Transferencia",
          notes: "",
        },
        {
          id: 1008,
          date: new Date("2024-01-08T19:45:00"),
          status: "delivered",
          total: 4100,
          items: [
            {
              name: "Empanadas de Jamón y Queso (6 unidades)",
              quantity: 1,
              price: 2400,
            },
            { name: "Ensalada Mixta", quantity: 1, price: 1500 },
            { name: "Agua Mineral 1.5L", quantity: 1, price: 600 },
          ],
          deliveryAddress: "Maipú 654, CABA",
          paymentMethod: "Efectivo",
          notes: "",
        },
      ];

      let filteredOrders = [...orders];
      let currentStatus = "all";
      let currentSearch = "";
      let currentDateFilter = "all";
      let currentAmountFilter = "all";
      let currentSort = "date-desc";

      // Initialize page
      document.addEventListener("DOMContentLoaded", function () {
        updateStatusCounts();
        updateSummaryStats();
        renderOrders();
        setupEventListeners();
      });

      // Setup event listeners
      function setupEventListeners() {
        document
          .getElementById("search-input")
          .addEventListener("input", handleSearch);
        document
          .getElementById("date-filter")
          .addEventListener("change", handleDateFilter);
        document
          .getElementById("amount-filter")
          .addEventListener("change", handleAmountFilter);
        document
          .getElementById("sort-select")
          .addEventListener("change", handleSort);
        document
          .getElementById("date-from")
          .addEventListener("change", applyFilters);
        document
          .getElementById("date-to")
          .addEventListener("change", applyFilters);
      }

      // Handle search
      function handleSearch(event) {
        currentSearch = event.target.value.toLowerCase();
        applyFilters();
      }

      // Handle date filter
      function handleDateFilter(event) {
        currentDateFilter = event.target.value;
        const customRange = document.getElementById("custom-date-range");

        if (currentDateFilter === "custom") {
          customRange.classList.remove("hidden");
        } else {
          customRange.classList.add("hidden");
        }

        applyFilters();
      }

      // Handle amount filter
      function handleAmountFilter(event) {
        currentAmountFilter = event.target.value;
        applyFilters();
      }

      // Handle sort
      function handleSort(event) {
        currentSort = event.target.value;
        applyFilters();
      }

      // Filter by status
      function filterByStatus(status) {
        currentStatus = status;

        // Update button styles
        document.querySelectorAll(".filter-btn").forEach((btn) => {
          btn.classList.remove("filter-active");
          btn.classList.add(
            "bg-gray-200",
            "text-gray-700",
            "hover:bg-gray-300"
          );
        });

        const activeBtn = document.getElementById(`filter-${status}`);
        activeBtn.classList.add("filter-active");
        activeBtn.classList.remove(
          "bg-gray-200",
          "text-gray-700",
          "hover:bg-gray-300"
        );

        applyFilters();
      }

      // Apply all filters
      function applyFilters() {
        filteredOrders = orders.filter((order) => {
          // Status filter
          if (currentStatus !== "all" && order.status !== currentStatus) {
            return false;
          }

          // Search filter
          if (currentSearch) {
            const searchText = `${order.id} ${order.items
              .map((item) => item.name)
              .join(" ")}`.toLowerCase();
            if (!searchText.includes(currentSearch)) {
              return false;
            }
          }

          // Date filter
          if (!passesDateFilter(order.date)) {
            return false;
          }

          // Amount filter
          if (!passesAmountFilter(order.total)) {
            return false;
          }

          return true;
        });

        // Apply sorting
        sortOrders();

        // Update UI
        renderOrders();
        updateResultsCount();
      }

      // Check if order passes date filter
      function passesDateFilter(orderDate) {
        const now = new Date();
        const today = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate()
        );

        switch (currentDateFilter) {
          case "all":
            return true;
          case "today":
            return orderDate >= today;
          case "week":
            const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
            return orderDate >= weekAgo;
          case "month":
            const monthAgo = new Date(
              today.getFullYear(),
              today.getMonth() - 1,
              today.getDate()
            );
            return orderDate >= monthAgo;
          case "custom":
            const fromDate = document.getElementById("date-from").value;
            const toDate = document.getElementById("date-to").value;

            if (fromDate && orderDate < new Date(fromDate)) return false;
            if (toDate && orderDate > new Date(toDate + "T23:59:59"))
              return false;

            return true;
          default:
            return true;
        }
      }

      // Check if order passes amount filter
      function passesAmountFilter(total) {
        switch (currentAmountFilter) {
          case "all":
            return true;
          case "0-2000":
            return total <= 2000;
          case "2000-5000":
            return total > 2000 && total <= 5000;
          case "5000-10000":
            return total > 5000 && total <= 10000;
          case "10000+":
            return total > 10000;
          default:
            return true;
        }
      }

      // Sort orders
      function sortOrders() {
        switch (currentSort) {
          case "date-desc":
            filteredOrders.sort((a, b) => b.date - a.date);
            break;
          case "date-asc":
            filteredOrders.sort((a, b) => a.date - b.date);
            break;
          case "amount-desc":
            filteredOrders.sort((a, b) => b.total - a.total);
            break;
          case "amount-asc":
            filteredOrders.sort((a, b) => a.total - b.total);
            break;
          case "status":
            const statusOrder = {
              pending: 1,
              preparing: 2,
              ready: 3,
              delivered: 4,
              cancelled: 5,
            };
            filteredOrders.sort(
              (a, b) => statusOrder[a.status] - statusOrder[b.status]
            );
            break;
        }
      }

      // Clear all filters
      function clearAllFilters() {
        currentStatus = "all";
        currentSearch = "";
        currentDateFilter = "all";
        currentAmountFilter = "all";
        currentSort = "date-desc";

        // Reset UI elements
        document.getElementById("search-input").value = "";
        document.getElementById("date-filter").value = "all";
        document.getElementById("amount-filter").value = "all";
        document.getElementById("sort-select").value = "date-desc";
        document.getElementById("custom-date-range").classList.add("hidden");
        document.getElementById("date-from").value = "";
        document.getElementById("date-to").value = "";

        // Reset status buttons
        document.querySelectorAll(".filter-btn").forEach((btn) => {
          btn.classList.remove("filter-active");
          btn.classList.add(
            "bg-gray-200",
            "text-gray-700",
            "hover:bg-gray-300"
          );
        });
        document.getElementById("filter-all").classList.add("filter-active");
        document
          .getElementById("filter-all")
          .classList.remove(
            "bg-gray-200",
            "text-gray-700",
            "hover:bg-gray-300"
          );

        applyFilters();
      }

      // Update status counts
      function updateStatusCounts() {
        const counts = {
          all: orders.length,
          pending: orders.filter((o) => o.status === "pending").length,
          preparing: orders.filter((o) => o.status === "preparing").length,
          ready: orders.filter((o) => o.status === "ready").length,
          delivered: orders.filter((o) => o.status === "delivered").length,
          cancelled: orders.filter((o) => o.status === "cancelled").length,
        };

        Object.keys(counts).forEach((status) => {
          const element = document.getElementById(`count-${status}`);
          if (element) {
            element.textContent = counts[status];
          }
        });
      }

      // Update summary statistics
      function updateSummaryStats() {
        const totalOrders = orders.length;
        const totalSpent = orders
          .filter((o) => o.status !== "cancelled")
          .reduce((sum, o) => sum + o.total, 0);
        const pendingOrders = orders.filter((o) =>
          ["pending", "preparing", "ready"].includes(o.status)
        ).length;

        document.getElementById("total-orders").textContent = totalOrders;
        document.getElementById(
          "total-spent"
        ).textContent = `$${totalSpent.toLocaleString()}`;
        document.getElementById("pending-orders").textContent = pendingOrders;
      }

      // Update results count
      function updateResultsCount() {
        const count = filteredOrders.length;
        document.getElementById("results-count").textContent = count;

        let description = "";
        if (currentSearch) {
          description += ` que contienen "${currentSearch}"`;
        }
        if (currentStatus !== "all") {
          description += ` con estado "${getStatusName(currentStatus)}"`;
        }

        document.getElementById("filter-description").textContent = description;
      }

      // Get status display name
      function getStatusName(status) {
        const names = {
          pending: "Pendiente",
          preparing: "En preparación",
          ready: "Listo",
          delivered: "Entregado",
          cancelled: "Cancelado",
        };
        return names[status] || status;
      }

      // Get status color class
      function getStatusColor(status) {
        const colors = {
          pending: "status-pending",
          preparing: "status-preparing",
          ready: "status-ready",
          delivered: "status-delivered",
          cancelled: "status-cancelled",
        };
        return colors[status] || "bg-gray-500";
      }

      // Format date
      function formatDate(date) {
        return date.toLocaleDateString("es-AR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      // Render orders
      function renderOrders() {
        const container = document.getElementById("orders-container");
        const emptyState = document.getElementById("empty-state");

        if (filteredOrders.length === 0) {
          container.classList.add("hidden");
          emptyState.classList.remove("hidden");
          return;
        }

        container.classList.remove("hidden");
        emptyState.classList.add("hidden");

        container.innerHTML = filteredOrders
          .map(
            (order) => `
                <div class="order-card bg-white rounded-2xl shadow-sm p-6 hover-lift smooth-transition fade-in">
                    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between space-y-4 lg:space-y-0">
                        <div class="flex-1">
                            <div class="flex items-center space-x-4 mb-3">
                                <h3 class="text-lg font-semibold text-gray-800">Pedido #${
                                  order.id
                                }</h3>
                                <span class="px-3 py-1 rounded-full text-white text-sm font-medium ${getStatusColor(
                                  order.status
                                )}">
                                    ${getStatusName(order.status)}
                                </span>
                            </div>
                            
                            <div class="text-sm text-gray-600 mb-2">
                                📅 ${formatDate(order.date)} • 📍 ${
              order.deliveryAddress
            }
                            </div>
                            
                            <div class="text-sm text-gray-600 mb-3">
                                ${order.items.length} producto${
              order.items.length > 1 ? "s" : ""
            }: 
                                ${order.items
                                  .slice(0, 2)
                                  .map(
                                    (item) => `${item.name} (${item.quantity})`
                                  )
                                  .join(", ")}
                                ${
                                  order.items.length > 2
                                    ? ` y ${order.items.length - 2} más...`
                                    : ""
                                }
                            </div>
                            
                            <div class="text-2xl font-bold text-red-500">$${order.total.toLocaleString()}</div>
                        </div>
                        
                        <div class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-3">
                            <button onclick="viewOrderDetails(${
                              order.id
                            })" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 smooth-transition text-sm">
                                Ver detalles
                            </button>
                            
                            ${
                              order.status === "pending"
                                ? `
                                <button onclick="cancelOrder(${order.id})" class="px-4 py-2 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 smooth-transition text-sm">
                                    Cancelar
                                </button>
                            `
                                : ""
                            }
                            
                            ${
                              order.status === "delivered"
                                ? `
                                <button onclick="reorderItems(${order.id})" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 smooth-transition text-sm">
                                    Repetir pedido
                                </button>
                            `
                                : ""
                            }
                        </div>
                    </div>
                </div>
            `
          )
          .join("");
      }

      // View order details
      function viewOrderDetails(orderId) {
        const order = orders.find((o) => o.id === orderId);
        if (!order) return;

        const modalContent = document.getElementById("order-modal-content");
        modalContent.innerHTML = `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h4 class="text-xl font-semibold text-gray-800">Pedido #${
                              order.id
                            }</h4>
                            <p class="text-gray-600">${formatDate(
                              order.date
                            )}</p>
                        </div>
                        <span class="px-4 py-2 rounded-full text-white font-medium ${getStatusColor(
                          order.status
                        )}">
                            ${getStatusName(order.status)}
                        </span>
                    </div>
                    
                    <div class="border-t border-gray-200 pt-6">
                        <h5 class="font-semibold text-gray-800 mb-4">Productos</h5>
                        <div class="space-y-3">
                            ${order.items
                              .map(
                                (item) => `
                                <div class="flex justify-between items-center">
                                    <div>
                                        <span class="font-medium">${
                                          item.name
                                        }</span>
                                        <span class="text-gray-600 ml-2">x${
                                          item.quantity
                                        }</span>
                                    </div>
                                    <span class="font-semibold">$${(
                                      item.price * item.quantity
                                    ).toLocaleString()}</span>
                                </div>
                            `
                              )
                              .join("")}
                        </div>
                        <div class="border-t border-gray-200 mt-4 pt-4 flex justify-between items-center">
                            <span class="text-lg font-semibold">Total</span>
                            <span class="text-2xl font-bold text-red-500">$${order.total.toLocaleString()}</span>
                        </div>
                    </div>
                    
                    <div class="border-t border-gray-200 pt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <h5 class="font-semibold text-gray-800 mb-2">Dirección de entrega</h5>
                            <p class="text-gray-600">${
                              order.deliveryAddress
                            }</p>
                        </div>
                        <div>
                            <h5 class="font-semibold text-gray-800 mb-2">Método de pago</h5>
                            <p class="text-gray-600">${order.paymentMethod}</p>
                        </div>
                    </div>
                    
                    ${
                      order.notes
                        ? `
                        <div class="border-t border-gray-200 pt-6">
                            <h5 class="font-semibold text-gray-800 mb-2">Notas</h5>
                            <p class="text-gray-600">${order.notes}</p>
                        </div>
                    `
                        : ""
                    }
                    
                    <div class="border-t border-gray-200 pt-6 flex space-x-3">
                        ${
                          order.status === "pending"
                            ? `
                            <button onclick="cancelOrder(${order.id})" class="flex-1 bg-red-100 text-red-600 py-3 rounded-lg hover:bg-red-200 smooth-transition">
                                Cancelar pedido
                            </button>
                        `
                            : ""
                        }
                        
                        ${
                          order.status === "delivered"
                            ? `
                            <button onclick="reorderItems(${order.id})" class="flex-1 bg-red-500 text-white py-3 rounded-lg hover:bg-red-600 smooth-transition">
                                Repetir pedido
                            </button>
                        `
                            : ""
                        }
                        
                        <button onclick="closeOrderModal()" class="flex-1 bg-gray-200 text-gray-800 py-3 rounded-lg hover:bg-gray-300 smooth-transition">
                            Cerrar
                        </button>
                    </div>
                </div>
            `;

        document.getElementById("order-modal").classList.remove("hidden");
      }

      // Close order modal
      function closeOrderModal() {
        document.getElementById("order-modal").classList.add("hidden");
      }

      // Cancel order
      function cancelOrder(orderId) {
        if (confirm("¿Estás seguro que querés cancelar este pedido?")) {
          const order = orders.find((o) => o.id === orderId);
          if (order) {
            order.status = "cancelled";
            order.notes = "Cancelado por el cliente";

            updateStatusCounts();
            updateSummaryStats();
            applyFilters();
            closeOrderModal();

            alert("Pedido cancelado correctamente");
          }
        }
      }

      // Reorder items
      function reorderItems(orderId) {
        const order = orders.find((o) => o.id === orderId);
        if (order) {
          const itemsList = order.items
            .map((item) => `• ${item.name} (${item.quantity})`)
            .join("\n");
          alert(
            `Agregando productos al carrito:\n\n${itemsList}\n\nTotal: $${order.total.toLocaleString()}`
          );
          closeOrderModal();
        }
      }

      // Navigation functions
      function goBack() {
        alert("Volviendo al menú principal...");
      }

      function viewCart() {
        alert("Abriendo carrito de compras...");
      }

      function goToProducts() {
        alert("Navegando a la página de productos...");
      }

      function logout() {
        if (confirm("¿Estás seguro que querés cerrar sesión?")) {
          alert("Cerrando sesión...");
        }
      }
    </script>
