<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios | Rotisería Cacho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8f9fa;
        }
        .form-control:focus, .form-select:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 0.25rem rgba(239, 68, 68, 0.1);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-card {
            transition: all 0.3s ease;
        }
        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-light">
    <nav class="bg-white shadow-sm sticky-top">
        <div class="container-xl px-4 py-3">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <button onclick="goBack()" class="d-flex align-items-center gap-2 text-secondary text-decoration-none btn btn-link px-0" title="Volver al panel principal">
                        <i class="bi bi-arrow-left"></i>
                        <span class="fw-medium">Volver</span>
                    </button>
                    <div class="vr"></div>
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-danger rounded-3 d-flex align-items-center justify-content-center text-white fw-bold" style="width: 32px; height: 32px; font-size: 0.8rem;">
                            RC
                        </div>
                        <div>
                            <h1 class="h5 fw-bold text-dark mb-0">Gestión de Usuarios</h1>
                            <p class="mb-0 text-muted" style="font-size: 0.85rem;">Panel de Administración</p>
                        </div>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="text-end">
                        <p class="small fw-medium text-dark mb-0">Admin</p>
                    </div>
                    <div class="rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; background-color: #e5e7eb;">
                         <i class="bi bi-person-fill text-secondary"></i>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div class="container-xl px-4 py-5">
        <div class="bg-white rounded-3 shadow-sm border p-4 mb-4">
            <div class="row g-3 justify-content-between align-items-center">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Buscar por nombre o email...">
                    </div>
                </div>
                <div class="col-md-3">
                    <select id="roleFilter" class="form-select">
                        <option value="">Todos los roles</option>
                        <option value="user">Usuario</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="col-md-auto">
                    <button onclick="openUserModal()" class="gradient-bg text-white btn px-4 py-2 fw-medium d-flex align-items-center gap-2 w-100">
                        <i class="bi bi-plus-lg"></i>
                        <span>Nuevo Usuario</span>
                    </button>
                </div>
            </div>
        </div>
        <div id="usersGrid" class="row g-4">
            </div>
    </div>
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4">
                <form id="userForm">
                    <div class="modal-header">
                        <h5 class="modal-title h5 fw-bold" id="userModalTitle"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="userId">
                        <div class="mb-3">
                            <label for="userName" class="form-label small fw-medium">Nombre Completo</label>
                            <input type="text" id="userName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="userEmail" class="form-label small fw-medium">Email</label>
                            <input type="email" id="userEmail" class="form-control" required>
                        </div>
                         <div class="mb-3">
                            <label for="userPhone" class="form-label small fw-medium">Teléfono</label>
                            <input type="tel" id="userPhone" class="form-control">
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col">
                                <label for="userRole" class="form-label small fw-medium">Rol</label>
                                <select id="userRole" class="form-select" required>
                                    <option value="user">Usuario</option>
                                    <option value="admin">Administrador</option>
                                </select>
                            </div>
                            <div class="col">
                                <label for="userStatus" class="form-label small fw-medium">Estado</label>
                                <select id="userStatus" class="form-select" required>
                                    <option value="active">Activo</option>
                                    <option value="inactive">Inactivo</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="userPassword" class="form-label small fw-medium">Contraseña</label>
                            <input type="password" id="userPassword" class="form-control">
                            <div class="form-text small">Dejar en blanco para no cambiar.</div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger gradient-bg">Guardar Usuario</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let users = [
            { id: 1, name: "María González", email: "maria@email.com", phone: "11-3456-7890", role: "user", status: "active" },
            { id: 2, name: "Carlos Rodríguez", email: "carlos@email.com", phone: "11-4567-8901", role: "user", status: "active" },
            { id: 3, name: "Ana Martínez", email: "ana@email.com", phone: "11-5678-9012", role: "user", status: "inactive" },
            { id: 4, name: "Admin Cacho", email: "admin@rotiseria.com", phone: "11-6789-0123", role: "admin", status: "active" },
            { id: 5, name: "Luis Torres", email: "luis@email.com", phone: "11-7890-1234", role: "user", status: "active" },
            { id: 6, name: "Laura Sánchez", email: "laura@email.com", phone: "11-8901-2345", role: "user", status: "active" },
        ];
        let userModal;
        document.addEventListener('DOMContentLoaded', () => {
            userModal = new bootstrap.Modal(document.getElementById('userModal'));
            document.getElementById('searchInput').addEventListener('input', renderUsers);
            document.getElementById('roleFilter').addEventListener('change', renderUsers);
            document.getElementById('userForm').addEventListener('submit', handleUserFormSubmit);
            renderUsers();
        });
        function renderUsers() {
            const grid = document.getElementById('usersGrid');
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            const roleValue = document.getElementById('roleFilter').value;
            const filteredUsers = users.filter(u => {
                const searchMatch = u.name.toLowerCase().includes(searchValue) || u.email.toLowerCase().includes(searchValue);
                const roleMatch = roleValue ? u.role === roleValue : true;
                return searchMatch && roleMatch;
            });
            grid.innerHTML = ''; // Limpiar la grilla
            if (filteredUsers.length === 0) {
                grid.innerHTML = `<div class="col-12"><div class="text-center p-5 bg-light rounded-3 border"><i class="bi bi-search fs-1"></i><h4 class="mt-3">No se encontraron usuarios</h4></div></div>`;
                return;
            }
            filteredUsers.forEach(user => {
                const userCard = `
                    <div class="col-md-6 col-lg-4 fade-in">
                        <div class="card h-100 user-card shadow-sm">
                            <div class="card-body d-flex flex-column">
                                <div class="d-flex align-items-center mb-3">
                                    <div class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold me-3" style="width: 45px; height: 45px; background-color: #3b82f6;">
                                        ${user.name.split(' ').map(n => n[0]).join('').substring(0,2)}
                                    </div>
                                    <div>
                                        <p class="fw-bold text-dark mb-0">${user.name}</p>
                                        <p class="small text-muted mb-0">${user.email}</p>
                                    </div>
                                </div>
                                <div class="small text-muted mb-3">
                                    <i class="bi bi-telephone-fill"></i> ${user.phone || 'No disponible'}
                                </div>
                                <div class="mt-auto">
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <div>
                                            <span class="badge ${user.role === 'admin' ? 'bg-warning-subtle text-warning-emphasis' : 'bg-secondary-subtle'}">${user.role === 'admin' ? 'Admin' : 'Usuario'}</span>
                                            <span class="badge ${user.status === 'active' ? 'bg-success-subtle text-success-emphasis' : 'bg-danger-subtle text-danger-emphasis'} ms-1">${user.status === 'active' ? 'Activo' : 'Inactivo'}</span>
                                        </div>
                                    </div>
                                    <div class="d-grid gap-2 d-sm-flex">
                                        <button onclick="editUser(${user.id})" class="btn btn-sm btn-outline-secondary w-100">Editar</button>
                                        <button onclick="deleteUser(${user.id})" class="btn btn-sm btn-outline-danger w-100">Eliminar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += userCard;
            });
        }
        function openUserModal(id = null) {
            const form = document.getElementById('userForm');
            form.reset();
            const title = document.getElementById('userModalTitle');
            const passwordField = document.getElementById('userPassword');
            if (id) {
                const user = users.find(u => u.id === id);
                title.textContent = 'Editar Usuario';
                document.getElementById('userId').value = user.id;
                document.getElementById('userName').value = user.name;
                document.getElementById('userEmail').value = user.email;
                document.getElementById('userPhone').value = user.phone;
                document.getElementById('userRole').value = user.role;
                document.getElementById('userStatus').value = user.status;
                passwordField.placeholder = "Dejar en blanco para no cambiar";
            } else {
                title.textContent = 'Nuevo Usuario';
                document.getElementById('userId').value = '';
                passwordField.placeholder = "";
            }
            userModal.show();
        }
        function handleUserFormSubmit(event) {
            event.preventDefault();
            const formData = {
                id: document.getElementById('userId').value,
                name: document.getElementById('userName').value,
                email: document.getElementById('userEmail').value,
                phone: document.getElementById('userPhone').value,
                role: document.getElementById('userRole').value,
                status: document.getElementById('userStatus').value,
            };
            if (formData.id) {
                const index = users.findIndex(u => u.id == formData.id);
                users[index] = { ...users[index], ...formData };
            } else {
                formData.id = (users.length > 0 ? Math.max(...users.map(u => u.id)) : 0) + 1;
                users.push(formData);
            }
            renderUsers();
            userModal.hide();
        }
        function editUser(id) {
            openUserModal(id);
        }
        function deleteUser(id) {
            if (confirm('¿Estás seguro de que quieres eliminar este usuario?')) {
                users = users.filter(u => u.id !== id);
                renderUsers();
            }
        }
        function goBack() {
            window.location.href = 'admin_panel.html';
        }
    </script>
</body>
</html>
