<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos | Rotisería Cacho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .smooth-transition { transition: all 0.3s ease; }
        .form-control:focus, .form-select:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 0.25rem rgba(239, 68, 68, 0.25);
        }
        .hover-lift:hover { transform: translateY(-2px); }
        .gradient-bg { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .order-card:hover { box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,.15) !important; }
        .filter-btn.filter-active {
            background-color: #ef4444;
            color: white;
            border-color: #ef4444;
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-dropdown .dropdown-toggle:focus {
            box-shadow: none;
        }
        .user-dropdown .dropdown-menu {
            margin-top: 8px;
            left: 50%;
            transform: translateX(-50%);
        }
        .status-pending { background-color: #fbbf24; }
        .status-preparing { background-color: #3b82f6; }
        .status-ready { background-color: #10b981; }
        .status-delivered { background-color: #6b7280; }
        .status-cancelled { background-color: #ef4444; }
    </style>
</head>
<body class="bg-light min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-xl">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <div class="bg-danger rounded-2 d-flex align-items-center justify-content-center me-2" style="width: 40px; height: 40px;">
                    <span class="text-white fw-bold fs-5">RC</span>
                </div>
                <h1 class="h5 mb-0 fw-bold">Rotisería Cacho</h1>
            </a>
            <div class="dropdown user-dropdown">
                <a href="#" class="d-flex align-items-center text-decoration-none text-dark dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="bg-danger rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 36px; height: 36px;">
                        <span class="text-white fw-bold small">JD</span>
                    </div>
                    <span class="fw-semibold d-none d-sm-block">Juan Díaz</span>
                </a>
                <ul class="dropdown-menu" aria-labelledby="dropdownUser">
                    <li><a class="dropdown-item" href="#" onclick="menuPopup('carrito')">Carrito</a></li>
                    <li><a class="dropdown-item" href="#" onclick="menuPopup('perfil')">Perfil</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#" onclick="menuPopup('cerrar')">Cerrar sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="gradient-bg text-white py-5">
        <div class="container-xl text-center">
            <h2 class="display-5 fw-bold mb-3">Historial de Pedidos</h2>
            <p class="fs-5 text-danger-subtle mb-4">Seguí el estado de tus pedidos y repetí tus favoritos</p>
            <div class="d-flex justify-content-center">
            </div>
        </div>
    </div>
    <div class="container-xl py-5">
        <div class="card shadow-sm rounded-4 mb-5">
            <div class="card-body p-4">
                <div class="d-flex flex-column gap-4">
                    <div class="position-relative">
                        <input type="text" id="search-input" placeholder="Buscar por número de pedido o productos..." class="form-control form-control-lg ps-5">
                        <span class="position-absolute top-50 start-0 translate-middle-y ps-3 text-secondary">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </span>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <button onclick="filterByStatus('all')" id="filter-all" class="btn filter-btn filter-active">Todos (<span id="count-all">0</span>)</button>
                        <button onclick="filterByStatus('pending')" id="filter-pending" class="btn btn-light filter-btn">Pendientes (<span id="count-pending">0</span>)</button>
                        <button onclick="filterByStatus('preparing')" id="filter-preparing" class="btn btn-light filter-btn">En preparación (<span id="count-preparing">0</span>)</button>
                        <button onclick="filterByStatus('ready')" id="filter-ready" class="btn btn-light filter-btn">Listos (<span id="count-ready">0</span>)</button>
                        <button onclick="filterByStatus('delivered')" id="filter-delivered" class="btn btn-light filter-btn">Entregados (<span id="count-delivered">0</span>)</button>
                        <button onclick="filterByStatus('cancelled')" id="filter-cancelled" class="btn btn-light filter-btn">Cancelados (<span id="count-cancelled">0</span>)</button>
                    </div>
                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <p class="mb-0 text-secondary">
                            Mostrando <span id="results-count" class="fw-semibold text-dark">0</span> pedidos
                            <span id="filter-description" class="text-muted"></span>
                        </p>
                        <button onclick="clearAllFilters()" class="btn btn-link text-danger text-decoration-none p-0">Limpiar filtros</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="orders-container" class="vstack gap-3">
            </div>
        <div id="empty-state" class="text-center py-5 d-none">
            <div class="d-inline-flex bg-light rounded-circle mb-4" style="width: 6rem; height: 6rem;">
                <svg class="m-auto text-secondary" width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                </svg>
            </div>
            <h3 class="h4 text-body-secondary mb-2">No se encontraron pedidos</h3>
            <p class="text-muted mb-4">Probá ajustando los filtros o realizá tu primer pedido</p>
            <div>
                <button onclick="clearAllFilters()" class="btn btn-danger px-4 py-2">Limpiar filtros</button>
                <button onclick="goToProducts()" class="btn btn-light px-4 py-2">Ver productos</button>
            </div>
        </div>
    </div>
    <div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content rounded-4">
                <div class="modal-header border-0">
                    <h5 class="modal-title h4" id="orderModalLabel">Detalles del Pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" id="order-modal-content">
                    </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function menuPopup(action) {
            let msg = '';
            switch(action) {
                case 'carrito': msg = 'Navegando al carrito de compras.'; break;
                case 'perfil': msg = 'Accediendo a tu perfil de usuario.'; break;
                case 'cerrar': msg = 'Cerrando sesión...'; break;
                default: msg = 'Acción desconocida.';
            }
            alert(msg);
        }
        const orders = [
            { id: 1001, date: new Date("2024-01-15T19:30:00"), status: "delivered", total: 4500, items: [{ name: "Pollo al Spiedo Entero", quantity: 1, price: 3500 }, { name: "Papas Fritas Caseras", quantity: 1, price: 1200 }], deliveryAddress: "Av. Corrientes 1234, CABA", paymentMethod: "Efectivo", notes: "Sin cebolla en las papas" },
            { id: 1002, date: new Date("2024-01-14T20:15:00"), status: "cancelled", total: 2700, items: [{ name: "Empanadas de Carne (6 unidades)", quantity: 1, price: 2700 }], deliveryAddress: "San Martín 567, CABA", paymentMethod: "Tarjeta", notes: "Cancelado por el cliente" },
            { id: 1003, date: new Date("2024-01-13T18:45:00"), status: "ready", total: 6200, items: [{ name: "Milanesas de Pollo (4 unidades)", quantity: 1, price: 2800 }, { name: "Ensalada Mixta", quantity: 1, price: 1500 }, { name: "Coca Cola 1.5L", quantity: 2, price: 800 }, { name: "Flan Casero", quantity: 1, price: 1200 }], deliveryAddress: "Rivadavia 890, CABA", paymentMethod: "Transferencia", notes: "" },
            { id: 1004, date: new Date("2024-01-12T21:00:00"), status: "preparing", total: 8900, items: [{ name: "Pollo al Spiedo Entero", quantity: 2, price: 3500 }, { name: "Papas Fritas Caseras", quantity: 2, price: 1200 }, { name: "Ensalada Rusa", quantity: 1, price: 1400 }], deliveryAddress: "Florida 456, CABA", paymentMethod: "Efectivo", notes: "Pedido para las 21:30" },
            { id: 1005, date: new Date("2024-01-11T19:00:00"), status: "pending", total: 3700, items: [{ name: "Empanadas de Pollo (6 unidades)", quantity: 1, price: 2500 }, { name: "Flan Casero", quantity: 1, price: 1200 }], deliveryAddress: "Belgrano 123, CABA", paymentMethod: "Tarjeta", notes: "" },
            { id: 1006, date: new Date("2024-01-10T20:30:00"), status: "delivered", total: 12500, items: [{ name: "Pollo al Spiedo Entero", quantity: 3, price: 3500 }, { name: "Empanadas de Carne (6 unidades)", quantity: 1, price: 2700 }, { name: "Papas Fritas Caseras", quantity: 2, price: 1200 }, { name: "Coca Cola 1.5L", quantity: 2, price: 800 }], deliveryAddress: "Callao 789, CABA", paymentMethod: "Efectivo", notes: "Pedido familiar" },
            { id: 1007, date: new Date("2024-01-09T18:15:00"), status: "delivered", total: 5400, items: [{ name: "Milanesas de Carne (4 unidades)", quantity: 1, price: 3200 }, { name: "Puré de Papas", quantity: 1, price: 1000 }, { name: "Flan Casero", quantity: 1, price: 1200 }], deliveryAddress: "Santa Fe 321, CABA", paymentMethod: "Transferencia", notes: "" },
            { id: 1008, date: new Date("2024-01-08T19:45:00"), status: "delivered", total: 4100, items: [{ name: "Empanadas de Jamón y Queso (6 unidades)", quantity: 1, price: 2400 }, { name: "Ensalada Mixta", quantity: 1, price: 1500 }, { name: "Agua Mineral 1.5L", quantity: 1, price: 600 }], deliveryAddress: "Maipú 654, CABA", paymentMethod: "Efectivo", notes: "" }
        ];
        let filteredOrders = [...orders];
        let currentStatus = "all", currentSearch = "";
        let orderModal;
        document.addEventListener("DOMContentLoaded", function () {
            orderModal = new bootstrap.Modal(document.getElementById('orderModal'));
            updateStatusCounts();
            renderOrders();
            setupEventListeners();
        });
        function setupEventListeners() {
            document.getElementById("search-input").addEventListener("input", handleSearch);
        }
        function handleSearch(event) {
            currentSearch = event.target.value.toLowerCase();
            applyFilters();
        }
        function filterByStatus(status) {
            currentStatus = status;
            document.querySelectorAll(".filter-btn").forEach(btn => {
                btn.classList.remove("filter-active");
                btn.classList.add("btn-light");
            });
            const activeBtn = document.getElementById(`filter-${status}`);
            activeBtn.classList.add("filter-active");
            activeBtn.classList.remove("btn-light");
            applyFilters();
        }
        function applyFilters() {
            filteredOrders = orders.filter(order => {
                if (currentStatus !== "all" && order.status !== currentStatus) return false;
                if (currentSearch) {
                    const searchText = `${order.id} ${order.items.map(item => item.name).join(" ")}`.toLowerCase();
                    if (!searchText.includes(currentSearch)) return false;
                }
                return true;
            });
            filteredOrders.sort((a, b) => b.date - a.date);
            renderOrders();
            updateResultsCount();
        }
        function clearAllFilters() {
            currentStatus = "all";
            currentSearch = "";
            document.getElementById("search-input").value = "";
            filterByStatus('all');
        }
        function updateStatusCounts() {
            const counts = { all: orders.length, pending: orders.filter(o => o.status === "pending").length, preparing: orders.filter(o => o.status === "preparing").length, ready: orders.filter(o => o.status === "ready").length, delivered: orders.filter(o => o.status === "delivered").length, cancelled: orders.filter(o => o.status === "cancelled").length };
            Object.keys(counts).forEach(status => {
                const element = document.getElementById(`count-${status}`);
                if (element) element.textContent = counts[status];
            });
        }
        function updateResultsCount() {
            document.getElementById("results-count").textContent = filteredOrders.length;
            let description = "";
            if (currentSearch) description += ` que contienen "${currentSearch}"`;
            if (currentStatus !== "all") description += ` con estado "${getStatusName(currentStatus)}"`;
            document.getElementById("filter-description").textContent = description;
        }
        function getStatusName(status) {
            const names = { pending: "Pendiente", preparing: "En preparación", ready: "Listo", delivered: "Entregado", cancelled: "Cancelado" };
            return names[status] || status;
        }
        function formatDate(date) {
            return date.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
        }
        function renderOrders() {
            const container = document.getElementById("orders-container");
            const emptyState = document.getElementById("empty-state");
            const hasOrders = filteredOrders.length > 0;
            container.classList.toggle("d-none", !hasOrders);
            emptyState.classList.toggle("d-none", hasOrders);
            if(!hasOrders) return;
            container.innerHTML = filteredOrders.map(order => `
                <div class="card order-card shadow-sm rounded-4 hover-lift smooth-transition fade-in">
                    <div class="card-body p-4">
                        <div class="d-lg-flex align-items-center justify-content-between">
                            <div class="flex-grow-1">
                                <div class="d-flex align-items-center gap-3 mb-2">
                                    <h3 class="h5 card-title fw-semibold mb-0">Pedido #${order.id}</h3>
                                    <span class="badge text-white ${'status-' + order.status}">${getStatusName(order.status)}</span>
                                </div>
                                <p class="card-text text-muted small mb-2">📅 ${formatDate(order.date)} • 📍 ${order.deliveryAddress}</p>
                                <p class="card-text text-muted small mb-3">
                                    ${order.items.length} producto${order.items.length > 1 ? "s" : ""}: 
                                    ${order.items.slice(0, 2).map(item => `${item.name} (x${item.quantity})`).join(", ")}
                                    ${order.items.length > 2 ? ` y ${order.items.length - 2} más...` : ""}
                                </p>
                                <p class="h3 fw-bold text-danger mb-3 mb-lg-0">$${order.total.toLocaleString()}</p>
                            </div>
                            <div class="d-flex flex-column flex-sm-row gap-2">
                                <button onclick="viewOrderDetails(${order.id})" class="btn btn-light">Ver detalles</button>
                                ${order.status === "pending" ? `<button onclick="cancelOrder(${order.id})" class="btn btn-outline-danger">Cancelar</button>` : ""}
                                ${order.status === "delivered" ? `<button onclick="reorderItems(${order.id})" class="btn btn-danger">Repetir pedido</button>` : ""}
                            </div>
                        </div>
                    </div>
                </div>
            `).join("");
        }
        function viewOrderDetails(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;
            const modalContent = document.getElementById("order-modal-content");
            modalContent.innerHTML = `
                <div class="vstack gap-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="h5 fw-semibold mb-0">Pedido #${order.id}</h4>
                            <p class="text-muted small mb-0">${formatDate(order.date)}</p>
                        </div>
                        <span class="badge fs-6 text-white ${'status-' + order.status}">${getStatusName(order.status)}</span>
                    </div>
                    <div class="border-top pt-3">
                        <h5 class="fw-semibold mb-3">Productos</h5>
                        <div class="vstack gap-2">
                            ${order.items.map(item => `
                                <div class="d-flex justify-content-between">
                                    <span>${item.name} <span class="text-muted">x${item.quantity}</span></span>
                                    <span class="fw-semibold">$${(item.price * item.quantity).toLocaleString()}</span>
                                </div>
                            `).join("")}
                        </div>
                        <div class="border-top mt-3 pt-3 d-flex justify-content-between align-items-center">
                            <span class="h5 mb-0">Total</span>
                            <span class="h3 fw-bold text-danger mb-0">$${order.total.toLocaleString()}</span>
                        </div>
                    </div>
                    <div class="border-top pt-3 row">
                        <div class="col-md-6">
                            <h5 class="fw-semibold small mb-1">Dirección de entrega</h5>
                            <p class="text-muted mb-0">${order.deliveryAddress}</p>
                        </div>
                        <div class="col-md-6">
                            <h5 class="fw-semibold small mb-1">Método de pago</h5>
                            <p class="text-muted mb-0">${order.paymentMethod}</p>
                        </div>
                    </div>
                    ${order.notes ? `<div class="border-top pt-3"><h5 class="fw-semibold small mb-1">Notas</h5><p class="text-muted mb-0">${order.notes}</p></div>` : ""}
                    <div class="border-top pt-3 d-flex gap-2">
                        ${order.status === "pending" ? `<button onclick="cancelOrder(${order.id})" class="btn btn-outline-danger w-100">Cancelar pedido</button>` : ""}
                        ${order.status === "delivered" ? `<button onclick="reorderItems(${order.id})" class="btn btn-danger w-100">Repetir pedido</button>` : ""}
                        <button type="button" class="btn btn-light w-100" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            `;
            orderModal.show();
        }
        function cancelOrder(orderId) {
            if (confirm("¿Estás seguro que querés cancelar este pedido?")) {
                const order = orders.find(o => o.id === orderId);
                if (order) {
                    order.status = "cancelled";
                    order.notes = "Cancelado por el cliente";
                    updateStatusCounts();
                    applyFilters();
                    orderModal.hide();
                    alert("Pedido cancelado correctamente");
                }
            }
        }
        function reorderItems(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                const itemsList = order.items.map(item => `• ${item.name} (x${item.quantity})`).join("\\n");
                alert(`Agregando productos al carrito:\\n\\n${itemsList}\\n\\nTotal: $${order.total.toLocaleString()}`);
                orderModal.hide();
            }
        }
        function goToProducts() { alert("Navegando a la página de productos..."); }
    </script>
</body>
</html>
