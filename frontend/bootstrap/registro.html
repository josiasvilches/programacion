<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | Rotisería Cacho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #fee2e2 0%, #fef2f2 50%, #fff 100%);
            min-height: 100vh;
        }
        .form-control:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        .register-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="card border-light shadow-lg rounded-4 register-card">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="mx-auto mb-3 bg-danger rounded-3 d-flex align-items-center justify-content-center text-white fw-bold" style="width: 48px; height: 48px;">
                                RC
                            </div>
                            <h1 class="h3 fw-bold text-dark">Crea tu Cuenta</h1>
                            <p class="text-muted">Completa el formulario para registrarte.</p>
                        </div>
                        <form id="registerForm" novalidate>
                            <div class="mb-3">
                                <label for="name" class="form-label fw-medium">Nombre</label>
                                <input type="text" id="name" class="form-control" placeholder="nombre completo" required>
                                <div class="invalid-feedback">
                                    Por favor, ingresa tu nombre.
                                </div>
                            </div>
                             <div class="mb-3">
                                <label for="email" class="form-label fw-medium">Correo electrónico</label>
                                <input type="email" id="email" class="form-control" placeholder="tu@email.com" required>
                                <div class="invalid-feedback">
                                    Por favor, ingresa un email válido.
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label fw-medium">Número</label>
                                <input type="tel" id="phone" class="form-control" placeholder="Tu número" required>
                                <div class="invalid-feedback">
                                    Por favor, ingresa tu número de teléfono.
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-medium">Contraseña</label>
                                <input type="password" id="password" class="form-control" placeholder="Tu contraseña" required>
                                 <div class="invalid-feedback">
                                    Por favor, ingresa una contraseña.
                                </div>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-danger btn-lg fw-medium" style="background-color: #dc2626;">
                                    Registrar
                                </button>
                            </div>
                        </form>
                        <div class="text-center mt-4">
                            <p class="text-muted mb-0">¿Ya tenés cuenta? <a href="login.html" class="text-danger fw-medium">Iniciar sesión</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault();
            event.stopPropagation();
            const form = this;
            const fields = ['name', 'email', 'phone', 'password'];
            let allValid = true;
            fields.forEach(function(field) {
                const input = document.getElementById(field);
                if (!input.value) {
                    input.classList.add('is-invalid');
                    allValid = false;
                } else {
                    input.classList.remove('is-invalid');
                }
                if (field === 'email' && input.value && !input.value.includes('@')) {
                     input.classList.add('is-invalid');
                     allValid = false;
                }
            });
            if (allValid) {
                alert('¡Registro exitoso!');
            }
        });
        const inputs = document.querySelectorAll('#registerForm input');
        inputs.forEach(function(input) {
            input.addEventListener('input', function() {
                if (this.classList.contains('is-invalid')) {
                    this.classList.remove('is-invalid');
                }
            });
        });
    </script>
</body>
</html>
