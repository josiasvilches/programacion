<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Pedidos - Panel de Administración | Rotisería Cacho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8f9fa;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 0.25rem rgba(239, 68, 68, 0.1);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
        }
        
        .order-card {
            transition: all 0.3s ease;
        }
        
        .order-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .stats-card {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border-color: #dc2626;
        }
        
        .timeline-item {
            position: relative;
            padding-left: 30px; /* Espacio para la línea y el punto */
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 28px;
            bottom: -15px;
            width: 2px;
            background: #e9ecef;
        }
        
        .timeline-item:last-child::before {
            display: none;
        }

        .timeline-dot {
            position: absolute;
            left: 0;
            top: 20px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid white;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="bg-white shadow-sm sticky-top">
        <div class="container-xl px-4 py-3">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <button onclick="goBack()" class="d-flex align-items-center gap-2 text-secondary text-decoration-none btn btn-link px-0" title="Volver al panel principal">
                        <i class="bi bi-arrow-left"></i>
                        <span class="fw-medium">Volver</span>
                    </button>
                    <div class="vr"></div>
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-danger rounded-3 d-flex align-items-center justify-content-center text-white fw-bold" style="width: 32px; height: 32px; font-size: 0.8rem;">
                            RC
                        </div>
                        <div>
                            <h1 class="h5 fw-bold text-dark mb-0">Historial de Pedidos</h1>
                            <p class="mb-0 text-muted" style="font-size: 0.85rem;">Gestión y Seguimiento</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-xl px-4 py-5">
        <div class="bg-white rounded-3 shadow-sm border p-4 mb-4">
            <div class="row g-3 justify-content-between align-items-center mb-4">
                <div class="col-md-6">
                    <h2 class="h5 fw-bold text-dark mb-1">Gestión de Pedidos</h2>
                    <p class="text-muted mb-0">Administra y supervisa todos los pedidos del sistema</p>
                </div>
                <div class="col-md-auto">
                    <button onclick="refreshOrders()" class="btn btn-danger gradient-bg text-white d-flex align-items-center gap-2 w-100">
                        <i class="bi bi-arrow-clockwise"></i> <span>Actualizar</span>
                    </button>
                </div>
            </div>
            
            <div class="row g-3 mb-4">
                <div class="col-lg-6">
                    <input type="text" id="searchInput" placeholder="Buscar por número, cliente o teléfono..." class="form-control">
                </div>
                <div class="col-lg-3 col-md-6">
                    <select id="dateFilter" class="form-select">
                        <option value="all">Todos los Tiempos</option>
                        <option value="today">Hoy</option>
                    </select>
                </div>
                <div class="col-lg-3 col-md-6">
                    <select id="paymentFilter" class="form-select">
                        <option value="all">Todos los Pagos</option>
                        <option value="card">Tarjeta</option>
                        <option value="cash">Efectivo</option>
                    </select>
                </div>
            </div>
            
            <div class="d-flex flex-wrap gap-2">
                <button onclick="filterByStatus('all')" class="filter-btn btn btn-sm active" data-status="all">Todos</button>
                <button onclick="filterByStatus('preparing')" class="filter-btn btn btn-sm btn-light" data-status="preparing">En Preparación</button>
                <button onclick="filterByStatus('ready')" class="filter-btn btn btn-sm btn-light" data-status="ready">Listos</button>
                <button onclick="filterByStatus('delivered')" class="filter-btn btn btn-sm btn-light" data-status="delivered">Entregados</button>
                <button onclick="filterByStatus('cancelled')" class="filter-btn btn btn-sm btn-light" data-status="cancelled">Cancelados</button>
            </div>
        </div>

        <div class="row g-4" id="ordersGrid">
            </div>
    </div>

    <div class="modal fade" id="orderModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content rounded-4">
          <div class="modal-header">
            <h5 class="modal-title h5 fw-bold" id="modalOrderTitle"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-4">
                <div class="col-md-6">
                    <h4 class="h6 fw-bold">Información del Pedido</h4>
                    <div id="orderInfo" class="vstack gap-2 small"></div>
                    <hr class="my-3">
                    <h4 class="h6 fw-bold">Productos</h4>
                    <div id="orderItems" class="vstack gap-2"></div>
                </div>
                <div class="col-md-6">
                    <h4 class="h6 fw-bold">Historial de Estados</h4>
                    <div id="orderTimeline" class="vstack gap-3"></div>
                </div>
            </div>
          </div>
          <div class="modal-footer" id="orderActions"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let orders = [
            { id: 1001, customer: "María González", phone: "11-1234-5678", status: "preparing", total: 2850, paymentMethod: "card", orderDate: "2024-01-22T14:30:00", items: [{ name: "Pollo al Spiedo", qty: 1 }, { name: "Papas Fritas", qty: 2 }], history: [{ status: "preparing", date: "2024-01-22T14:32:00" }] },
            { id: 1002, customer: "Carlos Rodríguez", phone: "11-2345-6789", status: "ready", total: 1950, paymentMethod: "cash", orderDate: "2024-01-22T14:35:00", items: [{ name: "Milanesa", qty: 1 }], history: [{ status: "preparing", date: "2024-01-22T14:36:00" }, { status: "ready", date: "2024-01-22T14:55:00" }] },
            { id: 1003, customer: "Ana Martínez", phone: "11-3456-7890", status: "delivered", total: 3200, paymentMethod: "card", orderDate: "2024-01-21T20:10:00", items: [{ name: "Parrillada", qty: 1 }], history: [{ status: "preparing", date: "2024-01-21T20:12:00" }, { status: "ready", date: "2024-01-21T20:30:00" }, { status: "delivered", date: "2024-01-21T20:55:00" }] },
            { id: 1004, customer: "Luis Torres", phone: "11-4567-8901", status: "cancelled", total: 1500, paymentMethod: "cash", orderDate: "2024-01-21T19:45:00", items: [{ name: "Empanadas", qty: 3 }], history: [{ status: "preparing", date: "2024-01-21T19:47:00" }, { status: "cancelled", date: "2024-01-21T19:55:00" }] }
        ];

        let orderModal;

        document.addEventListener('DOMContentLoaded', () => {
            orderModal = new bootstrap.Modal(document.getElementById('orderModal'));
            
            document.getElementById('searchInput').addEventListener('input', renderOrders);
            document.getElementById('dateFilter').addEventListener('change', renderOrders);
            document.getElementById('paymentFilter').addEventListener('change', renderOrders);
            
            renderOrders();
        });

        function renderOrders() {
            const grid = document.getElementById('ordersGrid');
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            const dateValue = document.getElementById('dateFilter').value;
            const paymentValue = document.getElementById('paymentFilter').value;
            const statusValue = document.querySelector('.filter-btn.active').dataset.status;

            const filteredOrders = orders.filter(o => {
                const searchMatch = o.id.toString().includes(searchValue) || o.customer.toLowerCase().includes(searchValue) || o.phone.includes(searchValue);
                const dateMatch = dateValue === 'all' || isToday(new Date(o.orderDate));
                const paymentMatch = paymentValue === 'all' || o.paymentMethod === paymentValue;
                const statusMatch = statusValue === 'all' || o.status === statusValue;
                return searchMatch && dateMatch && paymentMatch && statusMatch;
            });

            grid.innerHTML = '';
            if (filteredOrders.length === 0) {
                grid.innerHTML = `<div class="col-12"><div class="text-center p-5 bg-light rounded-3 border"><i class="bi bi-search fs-1"></i><h4 class="mt-3">No se encontraron pedidos</h4></div></div>`;
                return;
            }

            filteredOrders.forEach(order => {
                const card = `
                    <div class="col-md-6 col-lg-4 fade-in">
                        <div class="card h-100 order-card shadow-sm" style="border-left: 4px solid ${getStatusColor(order.status)};">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <div>
                                        <h5 class="card-title h6 fw-bold text-dark mb-1">Pedido #${order.id}</h5>
                                        <p class="card-text small text-muted">${order.customer}</p>
                                    </div>
                                    <span class="badge" style="background-color: ${getStatusColor(order.status)}; color: white;">${getStatusName(order.status)}</span>
                                </div>
                                <p class="small"><i class="bi bi-list-ul"></i> ${order.items.map(i => `${i.qty}x ${i.name}`).join(', ')}</p>
                                <div class="d-flex justify-content-between align-items-center mt-3">
                                    <p class="h5 fw-bold text-dark mb-0">$${order.total.toFixed(2)}</p>
                                    <button class="btn btn-sm btn-outline-secondary" onclick="openOrderModal(${order.id})">Ver Detalles</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }
        
        function openOrderModal(id) {
            const order = orders.find(o => o.id === id);
            
            document.getElementById('modalOrderTitle').textContent = `Detalles del Pedido #${order.id}`;
            
            document.getElementById('orderInfo').innerHTML = `
                <div><strong>Cliente:</strong> ${order.customer}</div>
                <div><strong>Teléfono:</strong> ${order.phone}</div>
                <div><strong>Pago:</strong> ${order.paymentMethod === 'card' ? 'Tarjeta' : 'Efectivo'}</div>
                <div><strong>Fecha:</strong> ${formatDateTime(order.orderDate)}</div>
            `;
            
            document.getElementById('orderItems').innerHTML = order.items.map(i => `
                <div class="d-flex justify-content-between">
                    <span>${i.qty}x ${i.name}</span>
                </div>
            `).join('') + `<hr><div class="d-flex justify-content-between fw-bold"><span>Total</span><span>$${order.total.toFixed(2)}</span></div>`;

            document.getElementById('orderTimeline').innerHTML = order.history.map(h => `
                <div class="timeline-item">
                    <div class="timeline-dot" style="background-color: ${getStatusColor(h.status)};"></div>
                    <p class="fw-bold mb-0">${getStatusName(h.status)}</p>
                    <p class="small text-muted">${formatDateTime(h.date)}</p>
                </div>
            `).join('');
            
            const actionsContainer = document.getElementById('orderActions');
            actionsContainer.innerHTML = '';
            if (order.status === 'preparing') {
                actionsContainer.innerHTML += `<button class="btn btn-primary" onclick="updateStatus(${id}, 'ready')">Marcar como Listo</button>`;
            }
            if (order.status === 'ready') {
                actionsContainer.innerHTML += `<button class="btn btn-success" onclick="updateStatus(${id}, 'delivered')">Marcar como Entregado</button>`;
            }
            if (order.status !== 'delivered' && order.status !== 'cancelled') {
                 actionsContainer.innerHTML += `<button class="btn btn-danger" onclick="updateStatus(${id}, 'cancelled')">Cancelar Pedido</button>`;
            }

            orderModal.show();
        }

        function updateStatus(id, newStatus) {
            const order = orders.find(o => o.id === id);
            order.status = newStatus;
            order.history.push({ status: newStatus, date: new Date().toISOString() });
            renderOrders();
            orderModal.hide();
        }
        
        function filterByStatus(status) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active', 'gradient-bg');
                btn.classList.add('btn-light');
            });
            const activeBtn = document.querySelector(`.filter-btn[data-status="${status}"]`);
            activeBtn.classList.add('active', 'gradient-bg');
            activeBtn.classList.remove('btn-light');
            renderOrders();
        }
        
        const getStatusColor = s => ({ preparing: '#3b82f6', ready: '#8b5cf6', delivered: '#10b981', cancelled: '#ef4444' })[s] || '#6b7280';
        const getStatusName = s => ({ preparing: 'En Preparación', ready: 'Listo', delivered: 'Entregado', cancelled: 'Cancelado' })[s] || 'Pendiente';
        const isToday = d => new Date().toDateString() === d.toDateString();
        const formatDateTime = d => new Date(d).toLocaleString('es-AR');

        function refreshOrders() { renderOrders(); alert('Pedidos actualizados.'); }
        function goBack() { alert('Volviendo al panel principal...'); }

    </script>
</body>
</html>
