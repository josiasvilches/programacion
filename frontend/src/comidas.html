<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas - Rotisería Cacho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .smooth-transition {
            transition: all 0.3s ease;
        }
        
        .input-focus:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        
        .hover-lift:hover {
            transform: translateY(-4px);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        .product-card {
            transition: all 0.3s ease;
        }
        
        .product-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .filter-active {
            background-color: #ef4444;
            color: white;
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .product-image-bg {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 50%, #fecaca 100%);
        }
        
        .unavailable {
            opacity: 0.6;
            position: relative;
        }
        
        .unavailable::after {
            content: 'AGOTADO';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            background: rgba(239, 68, 68, 0.9);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            z-index: 10;
        }
        
        .popular-badge {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        }
        
        .new-badge {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
    </style>
</head>

                        </svg>

        <!-- Filters Section -->

            <div class="flex flex-col space-y-6">
                <!-- Search Bar -->
                <div class="flex-1">

                    </div>
                </div>

                <!-- Category Filters -->

                    <h3 class="text-sm font-semibold text-gray-700 mb-3">Categorías</h3>
                    <div class="flex flex-wrap gap-2">

                        </button>

                        <button onclick="filterByCategory('milanesas')" id="filter-milanesas" class="filter-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 py-2 rounded-lg text-sm font-medium smooth-transition">

                        <button onclick="filterByCategory('empanadas')" id="filter-empanadas" class="filter-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 py-2 rounded-lg text-sm font-medium smooth-transition">

                            Carnes (<span id="count-carnes">0</span>)
                        </button>
                    </div>
                </div>

                <!-- Price and Sort Filters -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Rango de precio</label>
                        <select id="price-filter" class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus smooth-transition">
                            <option value="all">Todos los precios</option>
                            <option value="0-2000">Hasta $2.000</option>
                            <option value="2000-4000">$2.000 - $4.000</option>
                            <option value="4000-6000">$4.000 - $6.000</option>
                            <option value="6000+">Más de $6.000</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Disponibilidad</label>
                        <select id="availability-filter" class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus smooth-transition">
                            <option value="all">Todos</option>
                            <option value="available">Solo disponibles</option>
                            <option value="unavailable">No disponibles</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Ordenar por</label>
                        <select id="sort-select" class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus smooth-transition">
                            <option value="name-asc">Nombre A-Z</option>
                            <option value="name-desc">Nombre Z-A</option>
                            <option value="price-asc">Precio menor a mayor</option>
                            <option value="price-desc">Precio mayor a menor</option>
                            <option value="popular">Más populares</option>
                        </select>
                    </div>
                </div>

                <!-- Results Info and Clear Filters -->

                    <p class="text-gray-600">
                        Mostrando <span id="results-count" class="font-semibold text-gray-800">0</span> comidas
                        <span id="filter-description" class="text-gray-500"></span>
                    </p>
                    <button onclick="clearAllFilters()" class="text-red-500 hover:text-red-600 font-medium text-sm smooth-transition">
                        Limpiar filtros
                    </button>
                </div>
            </div>
        </div>

        <!-- Products Grid -->
        <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Products will be dynamically inserted here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-16 hidden">
            <div class="w-24 h-24 bg-gray-100 rounded-full mx-auto mb-6 flex items-center justify-center">
                <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            <h3 class="text-xl font-semibold text-gray-600 mb-2">No se encontraron comidas</h3>
            <p class="text-gray-500 mb-6">Probá ajustando los filtros de búsqueda</p>
            <button onclick="clearAllFilters()" class="bg-red-500 text-white px-6 py-3 rounded-lg hover:bg-red-600 smooth-transition">
                Limpiar filtros
            </button>
        </div>
    </div>

            {

            },
            {

                category: "empanadas",
                price: 2200,

            },
            {

            },
            {

                name: "Asado de Tira",
                category: "carnes",
                price: 3800,
                available: true,
                popular: false,
                new: false,
                image: "🥩",
                description: "Asado de tira tierno con hueso",
                prepTime: "40-60 min",
                portions: "2-3 personas"
            },
            {
                id: 13,
                name: "Matambre a la Pizza",
                category: "carnes",
                price: 5200,
                available: false,
                popular: true,
                new: false,
                image: "🍕",
                description: "Matambre relleno con jamón, queso y salsa",
                prepTime: "60-90 min",
                portions: "4-6 personas"
            },
            {
                id: 14,
                name: "Pollo Grillé",
                category: "pollos",
                price: 2800,
                available: true,
                popular: false,
                new: true,
                image: "🍗",
                description: "Pollo marinado y grillado con hierbas",
                prepTime: "35-45 min",
                portions: "2-3 personas"
            }
        ];

        let filteredProducts = [...products];
        let currentCategory = 'all';
        let currentSearch = '';
        let currentPriceFilter = 'all';
        let currentAvailabilityFilter = 'all';
        let currentSort = 'name-asc';

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            updateCategoryCounts();
            updateSummaryStats();
            renderProducts();
            setupEventListeners();
        });

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('search-input').addEventListener('input', handleSearch);
            document.getElementById('price-filter').addEventListener('change', handlePriceFilter);
            document.getElementById('availability-filter').addEventListener('change', handleAvailabilityFilter);
            document.getElementById('sort-select').addEventListener('change', handleSort);
        }

        // Handle search
        function handleSearch(event) {
            currentSearch = event.target.value.toLowerCase();
            const clearBtn = document.getElementById('clear-search');
            
            if (currentSearch) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            
            applyFilters();
        }

        // Clear search
        function clearSearch() {
            document.getElementById('search-input').value = '';
            document.getElementById('clear-search').classList.add('hidden');
            currentSearch = '';
            applyFilters();
        }

        // Handle price filter
        function handlePriceFilter(event) {
            currentPriceFilter = event.target.value;
            applyFilters();
        }

        // Handle availability filter
        function handleAvailabilityFilter(event) {
            currentAvailabilityFilter = event.target.value;
            applyFilters();
        }

        // Handle sort
        function handleSort(event) {
            currentSort = event.target.value;
            applyFilters();
        }

        // Filter by category
        function filterByCategory(category) {
            currentCategory = category;
            
            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('filter-active');
                btn.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
            });
            
            const activeBtn = document.getElementById(`filter-${category}`);
            activeBtn.classList.add('filter-active');
            activeBtn.classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
            
            applyFilters();
        }

        // Apply all filters
        function applyFilters() {
            filteredProducts = products.filter(product => {
                // Category filter
                if (currentCategory !== 'all' && product.category !== currentCategory) {
                    return false;
                }
                
                // Search filter
                if (currentSearch && !product.name.toLowerCase().includes(currentSearch)) {
                    return false;
                }
                
                // Price filter
                if (!passesPriceFilter(product.price)) {
                    return false;
                }
                
                // Availability filter
                if (currentAvailabilityFilter !== 'all') {
                    if (currentAvailabilityFilter === 'available' && !product.available) {
                        return false;
                    }
                    if (currentAvailabilityFilter === 'unavailable' && product.available) {
                        return false;
                    }
                }
                
                return true;
            });
            
            // Apply sorting
            sortProducts();
            
            // Update UI
            renderProducts();
            updateResultsCount();
        }

        // Check if product passes price filter
        function passesPriceFilter(price) {
            switch (currentPriceFilter) {
                case 'all':
                    return true;
                case '0-2000':
                    return price <= 2000;
                case '2000-4000':
                    return price > 2000 && price <= 4000;
                case '4000-6000':
                    return price > 4000 && price <= 6000;
                case '6000+':
                    return price > 6000;
                default:
                    return true;
            }
        }

        // Sort products
        function sortProducts() {
            switch (currentSort) {
                case 'name-asc':
                    filteredProducts.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'name-desc':
                    filteredProducts.sort((a, b) => b.name.localeCompare(a.name));
                    break;
                case 'price-asc':
                    filteredProducts.sort((a, b) => a.price - b.price);
                    break;
                case 'price-desc':
                    filteredProducts.sort((a, b) => b.price - a.price);
                    break;
                case 'popular':
                    filteredProducts.sort((a, b) => {
                        if (a.popular && !b.popular) return -1;
                        if (!a.popular && b.popular) return 1;
                        return a.name.localeCompare(b.name);
                    });
                    break;
            }
        }

        // Clear all filters
        function clearAllFilters() {
            currentCategory = 'all';
            currentSearch = '';
            currentPriceFilter = 'all';
            currentAvailabilityFilter = 'all';
            currentSort = 'name-asc';
            
            // Reset UI elements
            document.getElementById('search-input').value = '';
            document.getElementById('clear-search').classList.add('hidden');
            document.getElementById('price-filter').value = 'all';
            document.getElementById('availability-filter').value = 'all';
            document.getElementById('sort-select').value = 'name-asc';
            
            // Reset category buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('filter-active');
                btn.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
            });
            document.getElementById('filter-all').classList.add('filter-active');
            document.getElementById('filter-all').classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
            
            applyFilters();
        }

        // Update category counts
        function updateCategoryCounts() {
            const counts = {
                all: products.length,
                pollos: products.filter(p => p.category === 'pollos').length,
                milanesas: products.filter(p => p.category === 'milanesas').length,
                empanadas: products.filter(p => p.category === 'empanadas').length,
                carnes: products.filter(p => p.category === 'carnes').length
            };
            
            Object.keys(counts).forEach(category => {
                const element = document.getElementById(`count-${category}`);
                if (element) {
                    element.textContent = counts[category];
                }
            });
        }

        // Update summary statistics
        function updateSummaryStats() {
            const totalProducts = products.length;
            const availableProducts = products.filter(p => p.available).length;
            
            document.getElementById('total-products').textContent = totalProducts;
            document.getElementById('available-products').textContent = availableProducts;
        }

        // Update results count
        function updateResultsCount() {
            const count = filteredProducts.length;
            document.getElementById('results-count').textContent = count;
            
            let description = '';
            if (currentSearch) {
                description += ` que contienen "${currentSearch}"`;
            }
            if (currentCategory !== 'all') {
                description += ` en categoría "${currentCategory}"`;
            }
            
            document.getElementById('filter-description').textContent = description;
        }

        // Render products
        function renderProducts() {
            const container = document.getElementById('products-container');
            const emptyState = document.getElementById('empty-state');
            
            if (filteredProducts.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            emptyState.classList.add('hidden');
            
            container.innerHTML = filteredProducts.map(product => `
                <div class="product-card bg-white rounded-2xl shadow-sm overflow-hidden hover-lift smooth-transition fade-in ${!product.available ? 'unavailable' : ''}">
                    <div class="product-image-bg h-48 flex items-center justify-center relative">
                        <span class="text-6xl">${product.image}</span>
                        ${product.popular ? `
                            <div class="absolute top-3 left-3 popular-badge text-white px-2 py-1 rounded-full text-xs font-bold">
                                🔥 POPULAR
                            </div>
                        ` : ''}
                        ${product.new ? `
                            <div class="absolute top-3 right-3 new-badge text-white px-2 py-1 rounded-full text-xs font-bold">
                                ✨ NUEVO
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="p-6">
                        <div class="mb-3">
                            <h3 class="text-lg font-semibold text-gray-800 mb-1">${product.name}</h3>
                            <p class="text-sm text-gray-600 mb-2">${product.description}</p>
                            <div class="flex items-center text-xs text-gray-500 space-x-4">
                                <span>⏱️ ${product.prepTime}</span>
                                <span>👥 ${product.portions}</span>
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-between mb-4">
                            <div class="text-2xl font-bold text-red-500">$${product.price.toLocaleString()}</div>
                            <span class="px-2 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-medium capitalize">
                                ${product.category}
                            </span>
                        </div>
                        
                        <div class="flex space-x-2">
                            <button onclick="viewProduct(${product.id})" class="flex-1 bg-gray-200 text-gray-800 py-2 rounded-lg hover:bg-gray-300 smooth-transition text-sm font-medium">
                                Ver detalles
                            </button>
                            ${product.available ? `
                                <button onclick="addToCart(${product.id})" class="flex-1 bg-red-500 text-white py-2 rounded-lg hover:bg-red-600 smooth-transition text-sm font-medium">
                                    Agregar
                                </button>
                            ` : `
                                <button disabled class="flex-1 bg-gray-400 text-white py-2 rounded-lg cursor-not-allowed text-sm font-medium">
                                    No disponible
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // View product details
        function viewProduct(productId) {
            alert(`Navegando a los detalles del producto ID: ${productId}`);
        }

        // Add to cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (product && product.available) {
                alert(`${product.name} agregado al carrito - $${product.price.toLocaleString()}`);
                
                // Update cart count (simulate)
                const cartCount = document.getElementById('cart-count');
                const currentCount = parseInt(cartCount.textContent);
                cartCount.textContent = currentCount + 1;
                cartCount.classList.add('pulse-animation');
                setTimeout(() => cartCount.classList.remove('pulse-animation'), 1000);
            }
        }

        // Navigation functions
        function goBack() {
            alert('Volviendo al menú principal...');
        }

        function goToCategory(category) {
            alert(`Navegando a la página de ${category}...`);
        }

        function viewCart() {
            alert('Abriendo carrito de compras...');
        }

        function logout() {
            if (confirm('¿Estás seguro que querés cerrar sesión?')) {
                alert('Cerrando sesión...');
            }
        }
    </script>
