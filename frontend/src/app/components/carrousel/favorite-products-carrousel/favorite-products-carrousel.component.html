<!-- Menu Section -->
<section id="menu" class="py-20 bg-gray-50">
  <div class="max-w-6xl mx-auto px-6">
    <div class="text-center mb-16">
      <h2 class="text-4xl font-bold text-gray-800 mb-4">Nuestros Platos</h2>
      <p class="text-xl text-gray-600">Los favoritos de siempre</p>
    </div>
    
    <!-- Product Carousel -->
    <div class="relative">
      <div class="overflow-hidden rounded-2xl">
        <div class="flex transition-transform duration-500 ease-in-out"
             [style.transform]="'translateX(-' + (currentSlide * 100) + '%)'">
          @for (product of products; track product.id) {
            <div class="w-full flex-shrink-0 px-4">
              <div class="bg-white rounded-xl p-8 shadow-sm hover-lift smooth-transition max-w-md mx-auto">
                <div class="text-center mb-6">
                  <div class="w-20 h-20 bg-red-50 rounded-full mx-auto mb-4 flex items-center justify-center">
                    <span class="text-3xl">{{ product.emoji }}</span>
                  </div>
                  <h3 class="text-xl font-bold text-gray-800 mb-2">{{ product.name }}</h3>
                  <p class="text-gray-600">{{ product.description }}</p>
                </div>
                
                <div class="text-center mb-6">
                  <span class="text-3xl font-bold text-red-500">${{ product.price.toLocaleString() }}</span>
                  <span class="text-gray-500 ml-2">{{ product.unit }}</span>
                </div>
                
                <button (click)="addToCart(product)" 
                        class="w-full bg-red-500 text-white py-3 rounded-lg hover:bg-red-600 smooth-transition">
                  Agregar al Carrito
                </button>
              </div>
            </div>
          }
        </div>
      </div>
      
      <!-- Navigation Arrows -->
      <button (click)="previousSlide()" 
              class="absolute left-4 top-1/2 transform -translate-y-1/2 bg-white rounded-full p-3 shadow-lg hover:bg-gray-50 smooth-transition">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      <button (click)="nextSlide()" 
              class="absolute right-4 top-1/2 transform -translate-y-1/2 bg-white rounded-full p-3 shadow-lg hover:bg-gray-50 smooth-transition">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
      
      <!-- Dots Indicator -->
      <div class="flex justify-center mt-8 space-x-2">
        @for (product of products; track product.id; let i = $index) {
          <button (click)="goToSlide(i)"
                  class="w-3 h-3 rounded-full smooth-transition"
                  [class.bg-red-500]="i === currentSlide"
                  [class.bg-gray-300]="i !== currentSlide"
                  [class.hover:bg-gray-400]="i !== currentSlide">
          </button>
        }
      </div>
    </div>
  </div>
</section>
