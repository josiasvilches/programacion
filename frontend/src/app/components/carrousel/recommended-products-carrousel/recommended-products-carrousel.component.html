<!-- Recommended Products Section -->
<section class="py-20 bg-white">
  <div class="max-w-6xl mx-auto px-6">
    <div class="text-center mb-16">
      <h2 class="text-4xl font-bold text-gray-800 mb-4">Productos Recomendados</h2>
      <p class="text-xl text-gray-600">Otros platos que te van a encantar</p>
    </div>
    
    <div class="relative">
      <div class="overflow-hidden">
        <div class="flex space-x-6 transition-transform duration-500 ease-in-out"
             [style.transform]="'translateX(-' + currentPosition + 'px)'">
          @for (product of products; track product.id) {
            <div class="flex-shrink-0 w-80">
              <div class="bg-gray-50 rounded-xl p-6 hover-lift smooth-transition">
                <div class="text-center mb-4">
                  <div class="product-image">
                    <img
                      *ngIf="product.imagen_url && product.imagen_url.trim() !== ''"
                      [src]="product.imagen_url"
                      [alt]="product.name"
                      class="w-full h-48 object-cover rounded-lg mb-4"
                      (error)="onImageError($event, product)"
                    />
                    <div
                      *ngIf="!product.imagen_url || product.imagen_url.trim() === ''"
                      class="w-full h-48 bg-red-50 rounded-lg mb-4 flex items-center justify-center"
                    >
                      <span class="text-6xl">{{ product.emoji || '🍽️' }}</span>
                    </div>
                  </div>
                  <h4 class="text-lg font-bold text-gray-800 mb-2">{{ product.name }}</h4>
                  <p class="text-gray-600 text-sm">{{ product.description }}</p>
                </div>
                <div class="text-center mb-4">
                  <span class="text-2xl font-bold text-red-500">${{ product.price.toLocaleString() }}</span>
                  <span class="text-gray-500 text-sm ml-1">{{ product.unit }}</span>
                </div>
                <button (click)="addToCart(product)" 
                        class="w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600 smooth-transition text-sm">
                  Agregar al Carrito
                </button>
              </div>
            </div>
          }
        </div>
      </div>
      
      <!-- Navigation Arrows for Recommended -->
      <button (click)="scrollLeft()" 
              class="absolute left-0 top-1/2 transform -translate-y-1/2 bg-white rounded-full p-2 shadow-lg hover:bg-gray-50 smooth-transition">
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      <button (click)="scrollRight()" 
              class="absolute right-0 top-1/2 transform -translate-y-1/2 bg-white rounded-full p-2 shadow-lg hover:bg-gray-50 smooth-transition">
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>
  </div>
</section>
