<!-- Header -->
<header class="bg-white shadow-sm border-b border-gray-200 top-0 z-40 absolute left-0 w-full pl-16">
  <div class="px-6 py-4">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">{{ title }}</h1>
        <p class="text-gray-600 text-sm mt-1 subtitle">{{ subtitle }}</p>
      </div>
      
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-2 text-sm text-gray-600">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>{{ currentTime }}</span>
        </div>
        
        <div class="h-6 w-px bg-gray-300"></div>
        
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 bg-red-500 rounded-full flex items-center justify-center text-white text-sm font-medium">
            {{ adminUser.initials }}
          </div>
          <span class="text-sm font-medium text-gray-700">{{ adminUser.name }}</span>
        </div>
      </div>
    </div>
  </div>
</header>
