<!-- Header -->
<header class="bg-white shadow-sm border-b border-gray-200 top-0 z-40 absolute left-0 w-full pl-16" *ngIf="isUserLoggedIn()">
  <div class="px-6 py-4">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">{{ title }}</h1>
        <p class="text-gray-600 text-sm mt-1 subtitle">{{ subtitle }}</p>
      </div>
      
      <div class="flex items-center space-x-4">
        <!-- Time Display -->
        <div class="hidden md:flex items-center space-x-2 text-sm text-gray-600">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>{{ currentTime() }}</span>
        </div>
        
        <!-- User Dropdown -->
        <div class="relative">
          <button 
            (click)="toggleUserDropdown()"
            class="user-button flex items-center space-x-2 hover:bg-gray-50 rounded-lg px-3 py-2 transition-all duration-200 cursor-pointer">
            <div class="relative">
              <div class="user-avatar w-8 h-8 bg-red-500 rounded-full flex items-center justify-center text-white text-sm font-medium">
                {{ adminUser().initials }}
              </div>
              <!-- Indicador de estado online -->
              <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>
            </div>
            <span class="text-sm font-medium text-gray-700 md:block hidden">{{ adminUser().name }}</span>
            <svg 
              class="w-4 h-4 text-gray-500 transition-transform duration-200"
              [ngClass]="{'rotate-180': isUserDropdownOpen}"
              fill="none" 
              stroke="currentColor" 
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>
          
          <!-- Dropdown Menu -->
          <div 
            *ngIf="isUserDropdownOpen"
            class="dropdown-menu absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50"
            (click)="$event.stopPropagation()">
            
            <!-- User Info -->
            <div class="px-4 py-3 border-b border-gray-100">
              <div class="flex items-center space-x-3">
                <div class="relative">
                  <div class="w-10 h-10 bg-red-500 rounded-full flex items-center justify-center text-white font-medium">
                    {{ adminUser().initials }}
                  </div>
                  <!-- Indicador de estado online -->
                  <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-medium text-gray-900 truncate">{{ adminUser().name }}</p>
                  <p class="text-xs text-gray-500 truncate">{{ adminUser().email }}</p>
                  <p class="text-xs text-red-600 font-medium">{{ adminUser().role }}</p>
                </div>
              </div>
            </div>
            
            <!-- Menu Items -->
            <div class="py-2">
              <button 
                (click)="goToProfile()"
                class="dropdown-item w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-all duration-200 flex items-center space-x-3">
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span>Mi Perfil</span>
              </button>
              
              <button 
                (click)="goToWebsite()"
                class="dropdown-item w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-all duration-200 flex items-center space-x-3">
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                </svg>
                <span>Página Web</span>
              </button>
              
              <div class="border-t border-gray-100 my-2"></div>
              
              <button 
                (click)="logout()"
                class="dropdown-item w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-all duration-200 flex items-center space-x-3">
                <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                <span>Cerrar Sesión</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
