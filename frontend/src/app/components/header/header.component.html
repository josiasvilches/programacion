<!-- Navigation -->
<nav class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-6 py-4">
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <a routerLink="/" class="flex items-center space-x-3">
          <div
            class="w-10 h-10 bg-red-500 rounded-lg flex items-center justify-center text-white font-bold"
          >
            RC
          </div>
          <h1 class="text-xl font-bold text-gray-800">Rotisería Cacho</h1>
        </a>
      </div>

      <div class="hidden md:flex items-center space-x-8">
        <a
          routerLink="/comidas"
          class="text-gray-600 hover:text-red-500 smooth-transition cursor-pointer"
          >Comidas</a
        >
        <a
          routerLink="/comidas"
          class="text-gray-600 hover:text-red-500 smooth-transition cursor-pointer"
          >Guarniciones</a
        >
      </div>

      <div class="flex items-center space-x-4">
        <!-- User Dropdown (Solo si hay usuario logueado) -->
        @if (isUserLoggedIn) {
        <div class="relative user-dropdown">
          <button
            (click)="toggleDropdown()"
            class="flex items-center space-x-2 text-gray-700 hover:text-red-500 smooth-transition"
          >
            <div
              class="w-8 h-8 bg-red-500 rounded-full flex items-center justify-center text-white text-sm font-bold"
            >
              {{ user.initials }}
            </div>
            <span class="hidden md:block font-medium">{{ user.name }}</span>
            <svg
              class="w-4 h-4 transition-transform duration-200"
              [class.rotate-180]="isDropdownOpen"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              ></path>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          <div
            class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50"
            [class.hidden]="!isDropdownOpen"
          >
            <a
              routerLink="/user"
              class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-50 smooth-transition cursor-pointer"
            >
              <span class="mr-3">👤</span>
              Mi Usuario
            </a>
            <a
              class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-50 smooth-transition cursor-pointer"
            >
              <span class="mr-3">🔔</span>
              Notificaciones
              <span
                *ngIf="user.notifications > 0"
                class="ml-auto bg-red-500 text-white text-xs rounded-full px-2 py-1"
              >
                {{ user.notifications }}
              </span>
            </a>
            <a
              routerLink="/orders"
              class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-50 smooth-transition cursor-pointer"
            >
              <span class="mr-3">📦</span>
              Pedidos
            </a>
            <hr class="my-2 border-gray-200" />
            <a
              (click)="onLogout()"
              class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-50 smooth-transition cursor-pointer"
            >
              <span class="mr-3">🚪</span>
              Cerrar Sesión
            </a>
          </div>
        </div>
        } @else {
        <!-- Link para Iniciar Sesión (Solo si NO hay usuario logueado) -->
        <a
          routerLink="/login"
          class="flex items-center space-x-2 text-gray-700 hover:text-red-500 smooth-transition"
        >
          <div
            class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center text-gray-600"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              ></path>
            </svg>
          </div>
          <span class="hidden md:block font-medium">Iniciar Sesión</span>
        </a>
        }
        <!-- Cart Button -->
        <button
          (click)="onCartClick()"
          class="relative flex items-center space-x-2 text-gray-700 hover:text-red-500 smooth-transition"
        >
          <div class="relative">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-1.5 6M7 13l-1.5-6M20 13v6a2 2 0 01-2 2H6a2 2 0 01-2-2v-6m16 0V9a2 2 0 00-2-2H6a2 2 0 00-2 2v4.01"
              ></path>
            </svg>
            @if (cartItemsCount > 0) {
            <span
              class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold"
            >
              {{ cartItemsCount }}
            </span>
            }
          </div>
          <span class="hidden md:block font-medium">Carrito</span>
        </button>
        <!-- <button (click)="onOrderNow()" 
                class="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600 smooth-transition">
          Pedir Ahora
        </button> -->
      </div>
    </div>
  </div>
</nav>
