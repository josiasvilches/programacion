<div class="gradient-bg min-h-screen flex items-center justify-center p-4">
  <!-- Back to Home Button -->
  <div class="absolute top-6 left-6">
    <button 
      (click)="goBack()"
      class="flex items-center space-x-2 text-gray-600 hover:text-red-500 smooth-transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
      <span class="font-medium">Volver al inicio</span>
    </button>
  </div>

  <!-- Login Container -->
  <div class="w-full max-w-md">
    <!-- Logo and Title -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-red-500 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg">
        <span class="text-white font-bold text-2xl">RC</span>
      </div>
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Rotisería Cacho</h1>
      <p class="text-gray-600">Iniciá sesión en tu cuenta</p>
    </div>

    <!-- Login Form -->
    <div class="login-card rounded-2xl shadow-xl p-8 border border-white/20">
        <!-- Error Messages -->
        @if (errorMessage()) {
          <div class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg error-bounce">
            <div class="flex items-center">
              <svg class="h-5 w-5 text-red-500 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
              </svg>
              <span class="text-red-700 text-sm font-medium">{{ errorMessage() }}</span>
            </div>
          </div>
        }

        <!-- Success Messages -->
        @if (successMessage()) {
          <div class="mb-4 p-4 bg-green-50 border border-green-200 rounded-lg success-fade">
            <div class="flex items-center">
              <svg class="h-5 w-5 text-green-500 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
              </svg>
              <span class="text-green-700 text-sm font-medium">{{ successMessage() }}</span>
            </div>
          </div>
        }      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Email Field -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            Correo electrónico
          </label>
          <div class="relative">
            <input 
              type="email" 
              id="email" 
              formControlName="email"
              [class]="getInputClasses('email')"
              placeholder="tu@email.com"
            >
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
              </svg>
            </div>
          </div>
          @if (emailError()) {
            <div class="text-red-600 text-sm mt-2 flex items-center">
              <svg class="w-4 h-4 mr-1 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              {{ emailError() }}
            </div>
          }
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            Contraseña
          </label>
          <div class="relative">
            <input 
              [type]="showPassword() ? 'text' : 'password'"
              id="password" 
              formControlName="password"
              [class]="getInputClasses('password') + ' pr-12'"
              placeholder="Tu contraseña"
            >
            <button 
              type="button" 
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 smooth-transition"
            >
              @if (showPassword()) {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
                </svg>
              } @else {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              }
            </button>
          </div>
          @if (passwordError()) {
            <div class="text-red-600 text-sm mt-2 flex items-center">
              <svg class="w-4 h-4 mr-1 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              {{ passwordError() }}
            </div>
          }
        </div>

        <!-- Login Button -->
        @if (!isLoading()) {
          <button 
            type="submit"
            [disabled]="!canSubmit()"
            [class]="canSubmit() 
              ? 'w-full bg-red-500 text-white py-3 px-4 rounded-lg hover:bg-red-600 smooth-transition font-medium focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 shadow-md'
              : 'w-full bg-gray-400 text-white py-3 px-4 rounded-lg font-medium cursor-not-allowed opacity-60'"
          >
            Iniciar Sesión
          </button>
        } @else {
          <!-- Loading State -->
          <button 
            type="button" 
            class="w-full bg-red-400 text-white py-3 px-4 rounded-lg font-medium cursor-not-allowed shadow-md"
            disabled
          >
            <div class="flex items-center justify-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Iniciando sesión...
            </div>
          </button>
        }
      </form>

      <!-- Divider -->
      <div class="mt-8 pt-6 border-t border-gray-200">
        <p class="text-center text-sm text-gray-600">
          ¿No tenés cuenta? 
          <button 
            (click)="goToRegister()" 
            class="text-red-500 hover:text-red-600 font-medium smooth-transition">
            Registrate acá
          </button>
        </p>
      </div>
    </div>
  </div>
</div>
