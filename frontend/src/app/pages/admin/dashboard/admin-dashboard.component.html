<div class="admin-layout">
  <!-- Sidebar -->
  <app-admin-sidebar></app-admin-sidebar>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Header -->
    <app-admin-header 
      title="Panel General" 
      subtitle="Resumen y estadísticas principales">
    </app-admin-header>

    <!-- Dashboard Content -->
    <div class="fade-in">
      <!-- Quick Actions and Recent Orders -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
        <!-- Quick Actions -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <h3 class="text-lg font-bold text-gray-900 mb-4">Acciones Rápidas</h3>
          <div class="grid grid-cols-2 gap-4">
            <button 
              *ngFor="let action of quickActions"
              (click)="navigateTo(action.route)"
              class="quick-action p-4 rounded-lg text-center transition-all duration-200" 
              [ngClass]="action.bgColor">
              <svg class="w-8 h-8 mx-auto mb-2" [ngClass]="action.textColor" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="action.icon"></path>
              </svg>
              <p class="text-sm font-medium" [ngClass]="action.textColor">{{ action.title }}</p>
            </button>
          </div>
        </div>
        
        <!-- Recent Orders -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <h3 class="text-lg font-bold text-gray-900 mb-4">Pedidos Recientes</h3>
          <div class="space-y-3">
            <div 
              *ngFor="let order of recentOrders"
              class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
              <div>
                <p class="font-medium text-gray-900">{{ order.id }} - {{ order.customer }}</p>
                <p class="text-sm text-gray-600">{{ order.items }}</p>
              </div>
              <div class="text-right">
                <p class="font-bold text-gray-900">${{ order.total | number:'1.0-0' }}</p>
                <span class="text-xs px-2 py-1 rounded-full font-medium" [ngClass]="order.statusClass">
                  {{ order.statusText }}
                </span>
              </div>
            </div>
          </div>
          
          <button 
            (click)="navigateToOrders()"
            class="w-full mt-4 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-lg font-medium transition-colors">
            Ver Todos los Pedidos
          </button>
        </div>
      </div>
      
      <!-- Recent Activity -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <h3 class="text-lg font-bold text-gray-900 mb-4">Actividad Reciente</h3>
        <div class="space-y-4">
          <div 
            *ngFor="let activity of recentActivities"
            class="flex items-start space-x-4">
            <div class="w-8 h-8 rounded-full flex items-center justify-center" [ngClass]="activity.iconBg">
              <svg class="w-4 h-4 text-current" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="activity.icon"></path>
              </svg>
            </div>
            <div class="flex-1">
              <p class="text-sm font-medium text-gray-900">{{ activity.message }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
