<!-- Gradient Background -->
<div class="gradient-bg min-h-screen flex items-center justify-center p-4">
  <!-- Back to Home Button -->
  <div class="absolute top-6 left-6">
    <button
      (click)="goHome()"
      class="flex items-center space-x-2 text-gray-600 hover:text-red-500 smooth-transition"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 19l-7-7m0 0l7-7m-7 7h18"
        ></path>
      </svg>
      <span class="font-medium">Volver al inicio</span>
    </button>
  </div>

  <!-- Register Container -->
  <div class="w-full max-w-md">
    <!-- Logo and Title -->
    <div class="text-center mb-8">
      <div
        class="w-16 h-16 bg-red-500 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg"
      >
        <span class="text-white font-bold text-2xl">RC</span>
      </div>
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Rotisería Cacho</h1>
      <p class="text-gray-600">Creá tu cuenta</p>
    </div>

    <!-- Register Form -->
    <div class="login-card rounded-2xl shadow-xl p-8 border border-white/20">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Name Field -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-2"> Nombre </label>
          <div class="relative">
            <input
              type="text"
              id="name"
              formControlName="name"
              class="w-full px-4 py-3 border rounded-lg input-focus smooth-transition"
              [class.border-red-500]="nameError()"
              [class.border-gray-300]="!nameError()"
              placeholder="Nombre completo"
            />
          </div>
          @if (nameError()) {
          <div class="text-red-500 text-sm mt-1">
            {{ nameError() }}
          </div>
          }
        </div>

        <!-- Phone Field -->
        <div>
          <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
            Número de teléfono
          </label>
          <div class="relative">
            <input
              type="tel"
              id="phone"
              formControlName="phone"
              class="w-full px-4 py-3 border rounded-lg input-focus smooth-transition"
              [class.border-red-500]="phoneError()"
              [class.border-gray-300]="!phoneError()"
              placeholder="Número de teléfono"
            />
          </div>
          @if (phoneError()) {
          <div class="text-red-500 text-sm mt-1">
            {{ phoneError() }}
          </div>
          }
        </div>
        <!-- Email Field -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            Correo electrónico
          </label>
          <div class="relative">
            <input
              type="email"
              id="email"
              formControlName="email"
              class="w-full px-4 py-3 border rounded-lg input-focus smooth-transition"
              [class.border-red-500]="emailError()"
              [class.border-gray-300]="!emailError()"
              placeholder="tu@email.com"
            />
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
              <svg
                class="w-5 h-5 text-gray-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
                ></path>
              </svg>
            </div>
          </div>
          @if (emailError()) {
          <div class="text-red-500 text-sm mt-1">
            {{ emailError() }}
          </div>
          }
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            Contraseña
          </label>
          <div class="relative">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              formControlName="password"
              class="w-full px-4 py-3 border rounded-lg input-focus smooth-transition pr-12"
              [class.border-red-500]="passwordError()"
              [class.border-gray-300]="!passwordError()"
              placeholder="Tu contraseña"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 smooth-transition"
            >
              @if (showPassword()) {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"
                ></path>
              </svg>
              } @else {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                ></path>
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                ></path>
              </svg>
              }
            </button>
          </div>
          @if (passwordError()) {
          <div class="text-red-500 text-sm mt-1">
            {{ passwordError() }}
          </div>
          }
        </div>

        <!-- Register Button -->
        @if (!isLoading()) {
        <button
          type="submit"
          [disabled]="!isFormValid()"
          class="w-full bg-red-500 text-white py-3 px-4 rounded-lg hover:bg-red-600 smooth-transition font-medium focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          Registrarse
        </button>
        } @else {
        <!-- Loading State -->
        <button
          type="button"
          class="w-full bg-red-400 text-white py-3 px-4 rounded-lg font-medium cursor-not-allowed"
          disabled
        >
          <div class="flex items-center justify-center">
            <svg
              class="animate-spin -ml-1 mr-3 h-5 w-5 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            Registrando...
          </div>
        </button>
        }
      </form>

      <!-- Divider -->
      <div class="mt-8 pt-6 border-t border-gray-200">
        <p class="text-center text-sm text-gray-600">
          ¿Ya tenés cuenta?
          <button
            (click)="goToLogin()"
            class="text-red-500 hover:text-red-600 font-medium smooth-transition"
          >
            Iniciar Sesión
          </button>
        </p>
      </div>
    </div>
  </div>
</div>
